name: AI Integration Test

# Runs the AI integration smoke against live AWS Bedrock + Azure AI
# Foundry credentials. Probes each per-stage model, reports per-model
# latency / response preview, and surfaces a markdown table on the
# run page via GITHUB_STEP_SUMMARY.
#
# Triggers:
#   - workflow_dispatch — operators run it on demand to verify the
#     AWS / Azure secrets bootstrap reaches each provider.
#   - push to humanovo touching backend/scripts/ai_integration_smoke.py
#     or this workflow file — keeps the smoke script honest as the
#     stage-model assignments evolve.
#   - schedule: every 6 hours — surfaces a regression on the day it
#     happens (Bedrock model deprecation, Azure deployment
#     decommissioning, key rotation gone wrong) instead of the day
#     a user kicks off a discovery and gets an auth failure.
#
# Cost: each probe uses max_tokens=10. Six probes per run × $0.0001
# average per probe = ~$0.001 per run. Six-hour schedule = ~$0.004/day.
# Worth far more than that in early surfacing of provider issues.

on:
  workflow_dispatch:
  push:
    branches: [humanovo]
    paths:
      - 'backend/scripts/ai_integration_smoke.py'
      - 'backend/scripts/swarm_smoke.py'
      - 'backend/app/services/agents/**'
      - '.github/workflows/ai-integration-test.yml'
  schedule:
    # Cron is UTC. 02:00 / 08:00 / 14:00 / 20:00 UTC.
    - cron: '0 2,8,14,20 * * *'

permissions:
  contents: read

concurrency:
  # Per-ref concurrency — multiple pushes within minutes of each other
  # don't queue up duplicate probe runs. Cancel-in-progress is fine
  # because the script is idempotent + the next run will re-probe.
  group: ai-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 5 min was tight for 4-stage swarm; 12-stage version commonly
    # runs 60–180s plus per-model smoke (~10s) plus pip install (~30s).
    # 10 min leaves comfortable headroom without inviting hung CI.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Only the SDKs the smoke needs — avoids pulling the full
          # backend requirements.txt (which has 80+ packages and
          # would dominate the run time).
          pip install boto3 openai httpx

      - name: Run AI integration smoke
        env:
          # Map the GitHub-secret names to the env names the script
          # reads. AWS_NEW_* feeds boto3; AZURE_AI_* feeds the
          # AsyncAzureOpenAI client.
          AWS_NEW_ACCESS_KEY_ID: ${{ secrets.AWS_NEW_ACCESS_KEY_ID }}
          AWS_NEW_SECRET_ACCESS_KEY: ${{ secrets.AWS_NEW_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
          AZURE_AI_OPENAI_ENDPOINT: ${{ secrets.AZURE_AI_OPENAI_ENDPOINT }}
          AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          python backend/scripts/ai_integration_smoke.py

      - name: Run swarm smoke (end-to-end 12-stage grounded pipeline)
        # Runs after the per-stage smoke. Exercises the full 12-stage
        # discovery pipeline through Bedrock + Foundry with tool-calling
        # grounding, dual-embedding (large+small in parallel), and
        # critic-driven loopback (validate/ground/score can re-route
        # back to earlier stages). Asserts grounding carried end-to-end
        # (final answer mentions the canned tool fact).
        env:
          AWS_NEW_ACCESS_KEY_ID: ${{ secrets.AWS_NEW_ACCESS_KEY_ID }}
          AWS_NEW_SECRET_ACCESS_KEY: ${{ secrets.AWS_NEW_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
          AZURE_AI_OPENAI_ENDPOINT: ${{ secrets.AZURE_AI_OPENAI_ENDPOINT }}
          AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
          # Sub-agent fan-out per stage. Production default is 300
          # (settings.SUB_AGENTS_PER_STAGE) but at 12 stages × 300 ×
          # ~$0.01 per sub-agent the CI smoke would cost ~$36/run.
          # Cap to 4 in CI — enough to prove the swarm fans out, runs
          # parallel, aggregates, and tracks costs without burning
          # the budget on every push.
          HUMANOVO_SUBAGENTS: "4"
        run: |
          python backend/scripts/swarm_smoke.py
