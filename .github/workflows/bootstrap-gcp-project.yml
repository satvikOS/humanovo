name: Bootstrap GCP Project

# Stand up the GCP project for figure generation: enable APIs, create
# the figures-staging bucket, set up Workload Identity Federation so
# future workflows can impersonate the service account without static
# keys. Idempotent.
#
# Trigger: workflow_dispatch only.
#
# Required Actions Secrets (see docs/planning/CREDENTIALS_HANDOFF.md §3.5):
#   GCP_PROJECT_ID
#   GCP_PROJECT_NUMBER
#   GCP_REGION
#   GCP_SERVICE_ACCOUNT_EMAIL
#   GCP_SERVICE_ACCOUNT_KEY     (temporary — deleted after WIF takes over)
#   GEMINI_API_KEY
#   GCP_FIGURES_BUCKET

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Bootstrap phase: dry-run | apply'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      confirm_intent:
        description: 'Type humanovo-bootstrap-gcp to confirm'
        required: true
        type: string

concurrency:
  group: bootstrap-gcp-project
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm_intent }}" != "humanovo-bootstrap-gcp" ]; then
            echo "::error::Confirmation phrase does not match. Bootstrap aborted."
            exit 1
          fi

  bootstrap:
    name: Bootstrap (${{ inputs.phase }})
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f  # v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a  # v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify caller is the service account
        run: |
          gcloud config list
          ACTIVE=$(gcloud config get-value account)
          EXPECTED="${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}"
          if [ "$ACTIVE" != "$EXPECTED" ]; then
            echo "::error::Authenticated as '$ACTIVE' but expected '$EXPECTED'"
            exit 1
          fi
          echo "Service-account identity verified."

      - name: Enable required APIs (idempotent)
        if: inputs.phase == 'apply'
        run: |
          for API in \
            aiplatform.googleapis.com \
            generativelanguage.googleapis.com \
            storage.googleapis.com \
            logging.googleapis.com \
            monitoring.googleapis.com \
            iamcredentials.googleapis.com; do
            echo "Enabling $API ..."
            gcloud services enable "$API" --project="${{ secrets.GCP_PROJECT_ID }}"
          done

      - name: Create figures-staging bucket (idempotent)
        if: inputs.phase == 'apply'
        run: |
          BUCKET="${{ secrets.GCP_FIGURES_BUCKET }}"
          REGION="${{ secrets.GCP_REGION }}"
          if gcloud storage buckets describe "gs://$BUCKET" --project="${{ secrets.GCP_PROJECT_ID }}" 2>/dev/null; then
            echo "Bucket gs://$BUCKET already exists. Skipping."
          else
            gcloud storage buckets create "gs://$BUCKET" \
              --location="$REGION" \
              --uniform-bucket-level-access \
              --project="${{ secrets.GCP_PROJECT_ID }}"
            # 90-day lifecycle: figures auto-delete after 90 days unless
            # promoted to a permanent location by the backend
            cat > /tmp/lifecycle.json <<EOF
          {
            "lifecycle": {
              "rule": [{
                "action": {"type": "Delete"},
                "condition": {"age": 90}
              }]
            }
          }
          EOF
            gcloud storage buckets update "gs://$BUCKET" --lifecycle-file=/tmp/lifecycle.json
          fi

      - name: Verify Gemini 3 Pro Image quota
        if: inputs.phase == 'apply'
        run: |
          # We can't read quotas via gcloud directly without dedicated
          # APIs, so this step just runs a smoke call to verify the API
          # key works and the model is accessible.
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::warning::GEMINI_API_KEY not set — skipping smoke call."
          else
            echo "Running gemini-3-pro-image smoke call ..."
            curl -fsS -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-pro-image:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"a publication-grade phylogenetic tree of 5 mammal species, vector-clean style, Nature aesthetic"}]}]}' \
              -o /tmp/smoke.json && {
                echo "Smoke call succeeded. Image bytes received."
              } || {
                echo "::error::Smoke call to gemini-3-pro-image failed. Check the API key + quota approval."
                exit 1
              }
          fi

      - name: Workload Identity Federation setup (placeholder)
        if: inputs.phase == 'apply'
        run: |
          echo "TODO: Configure WIF for GitHub Actions OIDC -> GCP SA impersonation"
          echo "so future workflows do not need GCP_SERVICE_ACCOUNT_KEY."
          echo ""
          echo "After WIF is wired, the founder can DELETE the temporary"
          echo "GCP_SERVICE_ACCOUNT_KEY from Actions Secrets — same pattern"
          echo "as AWS OIDC for the management account."

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bootstrap GCP Project — ${{ inputs.phase }}"
            echo ""
            echo "Project: \`${{ secrets.GCP_PROJECT_ID }}\`"
            echo "Region: \`${{ secrets.GCP_REGION }}\`"
            echo "Figures bucket: \`${{ secrets.GCP_FIGURES_BUCKET }}\`"
            echo ""
            if [ "${{ inputs.phase }}" = "apply" ]; then
              echo "### Next steps"
              echo "1. Verify the figures-staging bucket exists in GCP console"
              echo "2. Verify the gemini-3-pro-image smoke call succeeded above"
              echo "3. Once all 3 clouds bootstrap green, trigger \`Backend — pipeline e2e (live LLM)\` for the cross-cloud canary"
            fi
          } >> $GITHUB_STEP_SUMMARY
