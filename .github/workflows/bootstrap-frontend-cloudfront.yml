name: Bootstrap Frontend (S3 + CloudFront, NEW account)

# Provisions the minimal frontend hosting stack in the *new* AWS
# business account: a private S3 bucket + a CloudFront distribution
# with Origin Access Control. Idempotent — safe to re-run.
#
# Output: the *.cloudfront.net hostname is printed to the run summary
# in big bold letters so the founder can paste it straight into a
# browser.
#
# Manual-only — do NOT auto-trigger. Provisioning new infra costs real
# money and shouldn't fire on every commit.
#
# Prerequisites (in repo Settings → Secrets):
#   AWS_NEW_ACCESS_KEY_ID
#   AWS_NEW_SECRET_ACCESS_KEY
# (kept distinct from the legacy AWS_ACCESS_KEY_ID / *_SECRET_ACCESS_KEY
# pair so a half-migrated state can't accidentally apply to the wrong
# account.)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment label (prod, staging, dev)'
        required: false
        default: 'prod'
      aws_region:
        description: 'AWS region'
        required: false
        default: 'us-east-1'
      admin_header_secret:
        description: 'X-Admin-Secret value the CloudFront URL will require (leave blank to keep current)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: bootstrap-frontend-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: '1.6.6'
  TF_STATE_BUCKET_PREFIX: humanovo-tf-state
  TF_LOCK_TABLE: humanovo-tf-locks
  TF_WORKING_DIR: infrastructure/terraform/bootstrap-frontend

jobs:
  bootstrap:
    name: Provision frontend bucket + CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (new account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_NEW_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NEW_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Confirm we're in the new account
        run: |
          aws sts get-caller-identity --output table
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "::notice title=AWS account::Operating in account $ACCOUNT_ID"

      - name: Ensure Terraform state bucket exists
        id: ensure_state
        run: |
          set -e
          REGION="${{ github.event.inputs.aws_region }}"
          BUCKET="${TF_STATE_BUCKET_PREFIX}-${REGION}"
          echo "Checking for state bucket: $BUCKET"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket already exists — reusing."
          else
            echo "Bucket missing — creating..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Ensure Terraform lock table exists
        run: |
          set -e
          REGION="${{ github.event.inputs.aws_region }}"
          if aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" --region "$REGION" >/dev/null 2>&1; then
            echo "Lock table exists — reusing."
          else
            echo "Creating lock table $TF_LOCK_TABLE..."
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE" --region "$REGION"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=frontend/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ github.event.inputs.aws_region }}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_admin_header_secret: ${{ github.event.inputs.admin_header_secret }}
        run: |
          # Build the -var args. If the user provided an admin secret,
          # use it; otherwise rely on the variable default in
          # admin-lockdown.tf (so first-apply still works without the
          # operator having to think about it).
          ARGS=(-no-color -out=tfplan)
          ARGS+=(-var "aws_region=${{ github.event.inputs.aws_region }}")
          ARGS+=(-var "environment=${{ github.event.inputs.environment }}")
          if [ -n "${{ github.event.inputs.admin_header_secret }}" ]; then
            ARGS+=(-var "admin_header_secret=${{ github.event.inputs.admin_header_secret }}")
          fi
          terraform plan "${ARGS[@]}"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve -no-color tfplan

      - name: Capture outputs
        id: tf_outputs
        if: always()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          # `if: always()` so we still try to recover the URL even if a
          # later optional step blew up. The capture itself can fail
          # cleanly (set +e) so a missing output doesn't kill the job
          # before we've printed anything useful.
          set +e
          DOMAIN=$(terraform output -raw cloudfront_domain 2>/dev/null)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null)
          BUCKET=$(terraform output -raw frontend_bucket 2>/dev/null)
          echo "domain=$DOMAIN"        >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID"      >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET"        >> "$GITHUB_OUTPUT"

          # Also dump straight to the run log so the URL shows up in
          # the per-job output, not only in the Summary tab.
          echo ""
          echo "==================================================================="
          if [ -n "$DOMAIN" ]; then
            echo "  CloudFront URL:  https://${DOMAIN}"
          else
            echo "  CloudFront URL:  (terraform output not available yet)"
          fi
          echo "  Distribution ID: ${DIST_ID:-(unknown)}"
          echo "  Origin bucket:   ${BUCKET:-(unknown)}"
          echo "==================================================================="
          echo ""

      - name: Print results to job summary
        if: always()
        run: |
          DOMAIN="${{ steps.tf_outputs.outputs.domain }}"
          DIST_ID="${{ steps.tf_outputs.outputs.dist_id }}"
          BUCKET="${{ steps.tf_outputs.outputs.bucket }}"

          {
            echo "## humanovo Frontend — NEW AWS Account"
            echo ""
            if [ -n "$DOMAIN" ]; then
              echo "### CloudFront URL (admin-only)"
              echo ""
              echo "**https://${DOMAIN}**"
              echo ""
              echo "**This URL is admin-only.** End users access humanovo via the"
              echo "native desktop app (Win/Mac/Linux). Browser access requires"
              echo "the \`X-Admin-Secret\` request header — install a header-injection"
              echo "extension (ModHeader, Requestly, etc.) and set:"
              echo ""
              echo "\`\`\`"
              echo "X-Admin-Secret: <admin_header_secret>"
              echo "\`\`\`"
              echo ""
              echo "Without the header CloudFront returns 403 \"humanovo - admin only\"."
              echo ""
              echo "First deploy will 403/404 until the dist/ is uploaded — CloudFront"
              echo "cold-distribution propagation typically takes 5-10 minutes after"
              echo "this workflow completes."
            else
              echo "### Could not capture CloudFront domain"
              echo ""
              echo "Terraform did not return a \`cloudfront_domain\` output. Likely causes:"
              echo "  - The apply step failed before reaching the cloudfront resource"
              echo "  - State backend mismatch (different region or environment)"
              echo "  - First-run AWS provider error (rare)"
              echo ""
              echo "Re-run with debug logs enabled (Actions → Run workflow → Enable debug logging)."
            fi
            echo ""
            echo "### Stack details"
            echo ""
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| AWS Account | \`${ACCOUNT_ID:-unknown}\` |"
            echo "| Region | \`${{ github.event.inputs.aws_region }}\` |"
            echo "| Environment | \`${{ github.event.inputs.environment }}\` |"
            echo "| CloudFront distribution | \`${DIST_ID:-not captured}\` |"
            echo "| Origin S3 bucket | \`${BUCKET:-not captured}\` |"
            echo "| Terraform state | \`${TF_STATE_BUCKET:-unknown}/frontend/${{ github.event.inputs.environment }}/terraform.tfstate\` |"
            if [ -n "$DOMAIN" ]; then
              echo ""
              echo "### Next steps"
              echo ""
              echo "1. Build the frontend: \`cd frontend && npm ci && npm run build\`"
              echo "2. Upload: \`aws s3 sync frontend/dist/ s3://${BUCKET}/ --delete\`"
              echo "3. Invalidate CloudFront cache:"
              echo "   \`aws cloudfront create-invalidation --distribution-id ${DIST_ID} --paths '/*'\`"
              echo "4. Wait ~5 minutes for first-time CloudFront propagation."
              echo ""
              echo "Or just run the **Deploy Frontend to NEW account** workflow —"
              echo "it does all four steps for you."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "==================================================================="
          if [ -n "$DOMAIN" ]; then
            echo "  CloudFront URL:  https://${DOMAIN}"
          else
            echo "  CloudFront URL:  (not available — see job summary)"
          fi
          echo "==================================================================="
          echo ""
