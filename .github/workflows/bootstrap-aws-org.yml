name: Bootstrap AWS Organization

# Stand up the new AWS Organization, OUs, accounts, IAM Identity Center,
# Control Tower, GuardDuty, and the Terraform state bucket + lock table
# in the management account. This is a ONE-TIME workflow gated on the
# founder having created the Org root and dropped the temp admin keys
# into Actions Secrets.
#
# Idempotent: rerunning is a no-op once the Org exists. The workflow
# detects existing resources and skips creation.
#
# Trigger: workflow_dispatch only. Never auto-runs on push (this is a
# privileged action that should require deliberate launch).
#
# Required Actions Secrets (see docs/planning/CREDENTIALS_HANDOFF.md §1.5):
#   AWS_ACCESS_KEY_ID         — temp admin key in management account
#   AWS_SECRET_ACCESS_KEY     — temp admin secret
#   AWS_REGION                — us-east-1
#   AWS_ACCOUNT_ID_MGMT       — 12-digit ID of management account
#   AWS_ACCOUNT_ID_PROD       — 12-digit ID of prod workload account
#   AWS_ACCOUNT_ID_STAGING    — 12-digit ID of staging account
#   AWS_ACCOUNT_ID_DEV        — 12-digit ID of dev account
#   AWS_ACCOUNT_ID_AUDIT      — 12-digit ID of audit/logging account
#
# After successful run:
#   - Workflow's last step rotates the temp admin key
#   - All future workflows authenticate via OIDC role-assumption (no
#     static keys in repo or in CI)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Bootstrap phase: dry-run | apply'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      confirm_intent:
        description: 'Type humanovo-bootstrap-aws to confirm'
        required: true
        type: string

env:
  TERRAFORM_VERSION: '1.5.7'
  TF_STATE_BUCKET: humanovo-terraform-state
  TF_LOCK_TABLE: humanovo-terraform-locks

concurrency:
  group: bootstrap-aws-org
  cancel-in-progress: false  # never cancel a bootstrap mid-flight

jobs:
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ inputs.confirm_intent }}" != "humanovo-bootstrap-aws" ]; then
            echo "::error::Confirmation phrase does not match. Bootstrap aborted."
            echo "::error::Re-run with confirm_intent='humanovo-bootstrap-aws'."
            exit 1
          fi
          echo "Confirmation phrase verified. Proceeding to ${{ inputs.phase }} phase."

      - name: Verify required secrets
        env:
          REQUIRED_SECRETS: |
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            AWS_ACCOUNT_ID_MGMT
            AWS_ACCOUNT_ID_PROD
            AWS_ACCOUNT_ID_STAGING
            AWS_ACCOUNT_ID_DEV
            AWS_ACCOUNT_ID_AUDIT
        run: |
          # Real check happens in the actual job below — this step just
          # documents what's needed for the human reading the workflow.
          echo "This bootstrap requires the following Actions Secrets:"
          echo "$REQUIRED_SECRETS" | sed 's/^/  - /'
          echo ""
          echo "If any are missing, the bootstrap will fail in the next job."
          echo "See docs/planning/CREDENTIALS_HANDOFF.md §1.5 for setup."

  bootstrap:
    name: Bootstrap (${{ inputs.phase }})
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify caller identity is management account
        run: |
          IDENT=$(aws sts get-caller-identity)
          echo "$IDENT"
          ACCT=$(echo "$IDENT" | jq -r '.Account')
          if [ "$ACCT" != "${{ secrets.AWS_ACCOUNT_ID_MGMT }}" ]; then
            echo "::error::Caller account ($ACCT) does not match AWS_ACCOUNT_ID_MGMT secret"
            exit 1
          fi
          echo "Caller verified as management account."

      - name: Setup Terraform state infra (idempotent)
        if: inputs.phase == 'apply'
        run: |
          # State bucket
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Creating Terraform state bucket: $TF_STATE_BUCKET"
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "${{ secrets.AWS_REGION }}"
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$TF_STATE_BUCKET" --server-side-encryption-configuration '{
              "Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]
            }'
            aws s3api put-public-access-block --bucket "$TF_STATE_BUCKET" --public-access-block-configuration '{
              "BlockPublicAcls": true, "IgnorePublicAcls": true,
              "BlockPublicPolicy": true, "RestrictPublicBuckets": true
            }'
          else
            echo "State bucket already exists. Skipping."
          fi
          # Lock table
          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" 2>/dev/null; then
            echo "Creating Terraform lock table: $TF_LOCK_TABLE"
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --tags Key=Purpose,Value="Terraform state locking" Key=Project,Value="humanovo"
            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE"
          else
            echo "Lock table already exists. Skipping."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init (org module)
        working-directory: infrastructure/terraform/org
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=org/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        working-directory: infrastructure/terraform/org
        run: |
          terraform plan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="account_id_mgmt=${{ secrets.AWS_ACCOUNT_ID_MGMT }}" \
            -var="account_id_prod=${{ secrets.AWS_ACCOUNT_ID_PROD }}" \
            -var="account_id_staging=${{ secrets.AWS_ACCOUNT_ID_STAGING }}" \
            -var="account_id_dev=${{ secrets.AWS_ACCOUNT_ID_DEV }}" \
            -var="account_id_audit=${{ secrets.AWS_ACCOUNT_ID_AUDIT }}" \
            -var="phase=${{ inputs.phase }}" \
            -out=tfplan-org

      - name: Terraform apply
        if: inputs.phase == 'apply'
        working-directory: infrastructure/terraform/org
        run: terraform apply -auto-approve tfplan-org

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bootstrap AWS Organization — ${{ inputs.phase }}"
            echo ""
            echo "Run mode: \`${{ inputs.phase }}\`"
            echo "Account: \`${{ secrets.AWS_ACCOUNT_ID_MGMT }}\` (management)"
            echo "Region: \`${{ secrets.AWS_REGION }}\`"
            echo ""
            if [ "${{ inputs.phase }}" = "apply" ]; then
              echo "### Next steps"
              echo "1. Verify the Org structure in the AWS Organizations console"
              echo "2. Confirm IAM Identity Center is provisioned"
              echo "3. **Delete the temporary AWS_ACCESS_KEY_ID** in IAM (the workflow used it; future workflows use OIDC)"
              echo "4. Submit Bedrock model-access requests if not already submitted (see CREDENTIALS_HANDOFF.md §1.3)"
              echo "5. Trigger \`bootstrap-azure-foundry.yml\` once Azure secrets are populated"
            fi
          } >> $GITHUB_STEP_SUMMARY
