name: Deploy humanovo Infrastructure & Backend

on:
  push:
    branches:
      - main
      - humanovo
      - 'claude/*'
    paths:
      - 'infrastructure/**'
      - 'backend/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.5.7'
  TF_STATE_BUCKET: genup-terraform-state
  TF_LOCK_TABLE: genup-terraform-locks
  ENVIRONMENT: dev
  TF_VAR_azure_ai_endpoint: ${{ secrets.AZURE_AI_ENDPOINT }}
  TF_VAR_azure_ai_key: ${{ secrets.AZURE_AI_KEY }}
  TF_VAR_azure_deepseek_endpoint: ${{ secrets.AZURE_DEEPSEEK_ENDPOINT }}
  TF_VAR_azure_deepseek_key: ${{ secrets.AZURE_DEEPSEEK_KEY }}
  TF_VAR_azure_mistral_endpoint: ${{ secrets.AZURE_MISTRAL_ENDPOINT }}
  TF_VAR_azure_mistral_key: ${{ secrets.AZURE_MISTRAL_KEY }}
  TF_VAR_azure_gpt4o_endpoint: ${{ secrets.AZURE_GPT4O_ENDPOINT }}
  TF_VAR_azure_gpt4o_key: ${{ secrets.AZURE_GPT4O_KEY }}
  TF_VAR_azure_cohere_endpoint: ${{ secrets.AZURE_COHERE_ENDPOINT }}
  TF_VAR_azure_cohere_key: ${{ secrets.AZURE_COHERE_KEY }}
  TF_VAR_azure_kimi_endpoint: ${{ secrets.AZURE_KIMI_ENDPOINT }}
  TF_VAR_azure_kimi_key: ${{ secrets.AZURE_KIMI_KEY }}
  TF_VAR_azure_o3mini_endpoint: ${{ secrets.AZURE_O3MINI_ENDPOINT }}
  TF_VAR_azure_o3mini_key: ${{ secrets.AZURE_O3MINI_KEY }}
  TF_VAR_azure_gpt41_endpoint: ${{ secrets.AZURE_GPT41_ENDPOINT }}
  TF_VAR_azure_gpt41_key: ${{ secrets.AZURE_GPT41_KEY }}
  TF_VAR_azure_phi4_endpoint: ${{ secrets.AZURE_PHI4_ENDPOINT }}
  TF_VAR_azure_phi4_key: ${{ secrets.AZURE_PHI4_KEY }}
  TF_VAR_azure_grok_endpoint: ${{ secrets.AZURE_GROK_ENDPOINT }}
  TF_VAR_azure_grok_key: ${{ secrets.AZURE_GROK_KEY }}
  TF_VAR_azure_embedding_endpoint: ${{ secrets.AZURE_EMBEDDING_ENDPOINT }}
  TF_VAR_azure_embedding_key: ${{ secrets.AZURE_EMBEDDING_KEY }}

jobs:
  deploy-infra:
    name: Deploy Infrastructure & Lambda Code
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform State Infrastructure
        run: |
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Creating Terraform state bucket: $TF_STATE_BUCKET"
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$TF_STATE_BUCKET" \
              --server-side-encryption-configuration '{
                "Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]
              }'
            aws s3api put-public-access-block --bucket "$TF_STATE_BUCKET" \
              --public-access-block-configuration '{
                "BlockPublicAcls": true,
                "IgnorePublicAcls": true,
                "BlockPublicPolicy": true,
                "RestrictPublicBuckets": true
              }'
          fi

          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" 2>/dev/null; then
            echo "Creating Terraform lock table: $TF_LOCK_TABLE"
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --tags Key=Purpose,Value="Terraform state locking"
            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE"
          fi

          echo "Terraform state infrastructure ready"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=infrastructure/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Force Unlock Stale Terraform State Lock
        working-directory: infrastructure/terraform
        continue-on-error: true
        run: |
          echo "Checking for stale Terraform state locks..."
          LOCK_ITEM=$(aws dynamodb get-item \
            --table-name "$TF_LOCK_TABLE" \
            --key '{"LockID": {"S": "genup-terraform-state/infrastructure/terraform.tfstate"}}' \
            --output json 2>/dev/null || echo '{}')

          LOCK_ID=$(echo "$LOCK_ITEM" | python3 -c "
          import json, sys
          try:
              item = json.load(sys.stdin)
              info = json.loads(item.get('Item', {}).get('Info', {}).get('S', '{}'))
              print(info.get('ID', ''))
          except Exception:
              print('')
          " 2>/dev/null)

          if [ -n "$LOCK_ID" ]; then
            echo "Found stale lock: $LOCK_ID — force-unlocking..."
            terraform force-unlock -force "$LOCK_ID" || echo "Force-unlock returned non-zero (lock may already be released)"
          else
            echo "No stale lock found"
          fi

      - name: Clean Terraform State for Re-import
        working-directory: infrastructure/terraform
        continue-on-error: true
        run: |
          echo "Cleaning stale state entries..."
          terraform state rm 'aws_kms_key.main' 2>/dev/null || true
          terraform state rm 'aws_kms_alias.main' 2>/dev/null || true
          terraform state rm 'aws_cloudwatch_log_group.main' 2>/dev/null || true
          terraform state rm 'module.api_gateway.aws_cloudwatch_log_group.api_gateway' 2>/dev/null || true

          for table in projects hypotheses evidence simulations knowledge_metadata agent_tasks knowledge embeddings ingestion_checkpoints rate_limits rag_cache ingestion_state; do
            terraform state rm "module.dynamodb.aws_dynamodb_table.${table}" 2>/dev/null || true
          done

          terraform state rm 'module.iam.aws_iam_role.lambda_execution' 2>/dev/null || true
          terraform state rm 'module.iam.aws_iam_role.api_gateway' 2>/dev/null || true
          terraform state rm 'module.iam.aws_iam_role.deployment' 2>/dev/null || true

          for fn in api_core projects hypotheses evidence knowledge hypothesis_generation agent_orchestrator search_agent embeddings simulation simulation_worker ingestion pubmed_fetcher clinical_trials_fetcher brave_search_fetcher embeddings_generator rag_retrieval ingestion_scheduler; do
            terraform state rm "module.lambda.aws_cloudwatch_log_group.lambda_logs[\"${fn}\"]" 2>/dev/null || true
          done

          terraform state rm 'module.lambda.aws_sqs_queue.simulation_dlq' 2>/dev/null || true
          terraform state rm 'module.lambda.aws_sqs_queue.simulation_queue' 2>/dev/null || true
          terraform state rm 'module.lambda.aws_sqs_queue.embeddings_dlq' 2>/dev/null || true
          terraform state rm 'module.lambda.aws_sqs_queue.embeddings_queue' 2>/dev/null || true

          echo "State cleanup complete"

      - name: Import Existing Resources
        working-directory: infrastructure/terraform
        continue-on-error: true
        run: |
          echo "Importing existing resources into Terraform state..."

          import_if_missing() {
            local resource_addr="$1"
            local resource_id="$2"
            if terraform state show "$resource_addr" >/dev/null 2>&1; then
              echo "Already in state: $resource_addr"
              return 0
            fi
            echo "Importing $resource_addr..."
            terraform import -var-file=environments/dev.tfvars "$resource_addr" "$resource_id" 2>&1 || echo "Could not import $resource_addr"
          }

          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          KMS_KEY_ID=$(aws kms list-aliases --query "Aliases[?AliasName=='alias/genup-dev'].TargetKeyId | [0]" --output text 2>/dev/null || echo "")
          if [ -n "$KMS_KEY_ID" ] && [ "$KMS_KEY_ID" != "None" ]; then
            import_if_missing 'aws_kms_key.main' "$KMS_KEY_ID"
            import_if_missing 'aws_kms_alias.main' 'alias/genup-dev'
          fi

          import_if_missing 'aws_cloudwatch_log_group.main' '/aws/genup/dev'
          import_if_missing 'module.api_gateway.aws_cloudwatch_log_group.api_gateway' '/aws/apigateway/genup-dev-api'

          for table in projects hypotheses evidence simulations knowledge-metadata agent-tasks knowledge embeddings ingestion-checkpoints rate-limits rag-cache ingestion-state; do
            tf_name="${table//-/_}"
            import_if_missing "module.dynamodb.aws_dynamodb_table.${tf_name}" "genup-dev-${table}"
          done

          import_if_missing 'module.iam.aws_iam_role.lambda_execution' 'genup-dev-lambda-execution'
          import_if_missing 'module.iam.aws_iam_role.api_gateway' 'genup-dev-api-gateway'
          import_if_missing 'module.iam.aws_iam_role.deployment' 'genup-dev-deployment'

          for fn in api_core projects hypotheses evidence knowledge hypothesis_generation agent_orchestrator search_agent embeddings simulation simulation_worker ingestion pubmed_fetcher clinical_trials_fetcher brave_search_fetcher embeddings_generator rag_retrieval ingestion_scheduler; do
            import_if_missing "module.lambda.aws_cloudwatch_log_group.lambda_logs[\"${fn}\"]" "/aws/lambda/genup-dev-${fn}"
          done

          import_if_missing 'module.lambda.aws_sqs_queue.simulation_dlq' "https://sqs.${AWS_REGION}.amazonaws.com/${AWS_ACCOUNT_ID}/genup-dev-simulation-dlq"
          import_if_missing 'module.lambda.aws_sqs_queue.simulation_queue' "https://sqs.${AWS_REGION}.amazonaws.com/${AWS_ACCOUNT_ID}/genup-dev-simulation-queue"
          import_if_missing 'module.lambda.aws_sqs_queue.embeddings_dlq' "https://sqs.${AWS_REGION}.amazonaws.com/${AWS_ACCOUNT_ID}/genup-dev-embeddings-dlq"
          import_if_missing 'module.lambda.aws_sqs_queue.embeddings_queue' "https://sqs.${AWS_REGION}.amazonaws.com/${AWS_ACCOUNT_ID}/genup-dev-embeddings-queue"

          EXISTING_BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'genup-dev-')].Name | [0]" --output text 2>/dev/null || echo "")
          if [ -n "$EXISTING_BUCKET" ] && [ "$EXISTING_BUCKET" != "None" ]; then
            import_if_missing 'module.s3.aws_s3_bucket.main' "$EXISTING_BUCKET"
          fi

          echo "Resource import complete."

      - name: Terraform Plan - S3 Buckets First
        working-directory: infrastructure/terraform
        run: |
          terraform plan \
            -var-file=environments/dev.tfvars \
            -target=module.s3 \
            -out=tfplan-s3 \
            -input=false

      - name: Terraform Apply - S3 Buckets
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan-s3

      - name: Get Unified Bucket Name
        id: get-bucket
        working-directory: infrastructure/terraform
        run: |
          GENUP_BUCKET=$(terraform output -raw bucket_name 2>/dev/null || echo "genup-${ENVIRONMENT}")
          echo "GENUP_BUCKET=$GENUP_BUCKET" >> $GITHUB_OUTPUT
          echo "Unified bucket: $GENUP_BUCKET"

      - name: Package and Upload Lambda Code
        run: |
          GENUP_BUCKET="${{ steps.get-bucket.outputs.GENUP_BUCKET }}"

          # --- Lambda Layers ---
          # Create layer with aws_lambda_powertools + openai (for Azure AI Foundry)
          mkdir -p /tmp/lambda-layer/python
          pip install "aws-lambda-powertools>=3.0,<4.0" "openai>=1.12.0,<2.0" -t /tmp/lambda-layer/python/ --quiet
          cd /tmp/lambda-layer && zip -r ../dependencies-layer.zip python/ -x '*.pyc' '*__pycache__*'

          # Create scipy placeholder layer (real scipy too large for quick deploy)
          mkdir -p /tmp/scipy-layer/python
          echo "# scipy placeholder" > /tmp/scipy-layer/python/__init__.py
          cd /tmp/scipy-layer && zip -r ../scipy-layer.zip python/

          echo "Uploading Lambda layers..."
          aws s3 cp /tmp/dependencies-layer.zip "s3://$GENUP_BUCKET/artifacts/lambda-layers/dependencies.zip"
          aws s3 cp /tmp/scipy-layer.zip "s3://$GENUP_BUCKET/artifacts/lambda-layers/scipy.zip"

          # --- Lambda Functions ---
          # Package REAL handler code from backend/lambda/handlers/
          HANDLERS_DIR="${GITHUB_WORKSPACE}/backend/lambda/handlers"

          # Map of function names to handler files
          declare -A HANDLER_FILES=(
            ["api_core"]="api_core.py"
            ["projects"]="projects.py"
            ["hypotheses"]="hypotheses.py"
            ["evidence"]="evidence.py"
            ["knowledge"]="knowledge.py"
            ["hypothesis_generation"]="hypothesis_generation.py"
            ["agent_orchestrator"]="agent_orchestrator.py"
            ["search_agent"]="search_agent.py"
            ["embeddings"]="embeddings.py"
            ["simulation"]="simulation.py"
            ["pubmed_fetcher"]="pubmed_fetcher.py"
            ["clinical_trials_fetcher"]="clinical_trials_fetcher.py"
            ["brave_search_fetcher"]="brave_search_fetcher.py"
            ["embeddings_generator"]="embeddings_generator.py"
            ["rag_retrieval"]="rag_retrieval.py"
            ["ingestion_scheduler"]="ingestion_scheduler.py"
            ["bulk_etl"]="bulk_etl.py"
          )

          # Functions that need placeholder (no handler file yet)
          PLACEHOLDER_FUNCTIONS="simulation_worker ingestion"

          echo "Packaging Lambda functions..."
          for fn in "${!HANDLER_FILES[@]}"; do
            handler_file="${HANDLER_FILES[$fn]}"
            if [ -f "$HANDLERS_DIR/$handler_file" ]; then
              echo "  Packaging $fn from $handler_file"
              mkdir -p /tmp/fn-$fn/handlers
              cp "$HANDLERS_DIR/$handler_file" "/tmp/fn-$fn/handlers/$handler_file"
              # Create __init__.py for the handlers package
              touch "/tmp/fn-$fn/handlers/__init__.py"

              # Bundle openai + reportlab directly into agent_orchestrator zip
              # (Lambda Layer may not refresh reliably due to Terraform lifecycle)
              if [ "$fn" = "agent_orchestrator" ]; then
                echo "    Installing openai + reportlab into $fn function zip..."
                pip install "openai>=1.12.0,<2.0" "reportlab>=4.0,<5.0" -t "/tmp/fn-$fn/" --quiet 2>/dev/null
              fi

              cd "/tmp/fn-$fn" && zip -r "/tmp/$fn.zip" . -x '*.pyc' '*__pycache__*'
              aws s3 cp "/tmp/$fn.zip" "s3://$GENUP_BUCKET/artifacts/lambda-functions/$fn.zip"
            else
              echo "  WARNING: No handler file for $fn, using placeholder"
              aws s3 cp /tmp/scipy-layer.zip "s3://$GENUP_BUCKET/artifacts/lambda-functions/$fn.zip"
            fi
          done

          # Upload placeholders for functions without handler files
          for fn in $PLACEHOLDER_FUNCTIONS; do
            echo "  Placeholder for $fn"
            mkdir -p /tmp/fn-$fn/handlers
            cat > "/tmp/fn-$fn/handlers/${fn}.py" << 'PYEOF'
          import json
          def handler(event, context):
              return {'statusCode': 200, 'body': json.dumps({'status': 'ok', 'function': '${fn}'})}
          PYEOF
            touch "/tmp/fn-$fn/handlers/__init__.py"
            cd "/tmp/fn-$fn" && zip -r "/tmp/$fn.zip" handlers/
            aws s3 cp "/tmp/$fn.zip" "s3://$GENUP_BUCKET/artifacts/lambda-functions/$fn.zip"
          done

          echo "Lambda code packaged and uploaded"

      - name: Terraform Plan - Full Infrastructure
        working-directory: infrastructure/terraform
        run: |
          terraform plan \
            -var-file=environments/dev.tfvars \
            -out=tfplan \
            -input=false

      - name: Terraform Apply - Full Infrastructure
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Deploy Lambda Function Code
        run: |
          GENUP_BUCKET="${{ steps.get-bucket.outputs.GENUP_BUCKET }}"
          NAME_PREFIX="genup-${ENVIRONMENT}"

          echo "Deploying Lambda function code..."

          ALL_FUNCTIONS="api_core projects hypotheses evidence knowledge hypothesis_generation agent_orchestrator search_agent embeddings simulation simulation_worker ingestion pubmed_fetcher clinical_trials_fetcher brave_search_fetcher embeddings_generator rag_retrieval ingestion_scheduler bulk_etl"

          for fn in $ALL_FUNCTIONS; do
            echo "  Updating ${NAME_PREFIX}-${fn}..."
            aws lambda update-function-code \
              --function-name "${NAME_PREFIX}-${fn}" \
              --s3-bucket "$GENUP_BUCKET" \
              --s3-key "artifacts/lambda-functions/${fn}.zip" \
              --no-cli-pager 2>/dev/null || echo "  WARNING: Failed to update ${fn} (may not exist yet)"
          done

          echo "Lambda functions updated"

          # Wait for updates to propagate
          echo "Waiting for Lambda updates to propagate..."
          sleep 10

          # Verify key functions
          for fn in api_core projects agent_orchestrator; do
            echo "  Checking ${NAME_PREFIX}-${fn}..."
            aws lambda get-function --function-name "${NAME_PREFIX}-${fn}" --query 'Configuration.{State:State,LastModified:LastModified}' --no-cli-pager 2>/dev/null || echo "  Could not verify ${fn}"
          done

      - name: Update Agent Orchestrator Azure AI Env Vars
        env:
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
          AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
          AZURE_DEEPSEEK_ENDPOINT: ${{ secrets.AZURE_DEEPSEEK_ENDPOINT }}
          AZURE_DEEPSEEK_KEY: ${{ secrets.AZURE_DEEPSEEK_KEY }}
          AZURE_MISTRAL_ENDPOINT: ${{ secrets.AZURE_MISTRAL_ENDPOINT }}
          AZURE_MISTRAL_KEY: ${{ secrets.AZURE_MISTRAL_KEY }}
          AZURE_GPT4O_ENDPOINT: ${{ secrets.AZURE_GPT4O_ENDPOINT }}
          AZURE_GPT4O_KEY: ${{ secrets.AZURE_GPT4O_KEY }}
          AZURE_COHERE_ENDPOINT: ${{ secrets.AZURE_COHERE_ENDPOINT }}
          AZURE_COHERE_KEY: ${{ secrets.AZURE_COHERE_KEY }}
          AZURE_KIMI_ENDPOINT: ${{ secrets.AZURE_KIMI_ENDPOINT }}
          AZURE_KIMI_KEY: ${{ secrets.AZURE_KIMI_KEY }}
          AZURE_O3MINI_ENDPOINT: ${{ secrets.AZURE_O3MINI_ENDPOINT }}
          AZURE_O3MINI_KEY: ${{ secrets.AZURE_O3MINI_KEY }}
          AZURE_GPT41_ENDPOINT: ${{ secrets.AZURE_GPT41_ENDPOINT }}
          AZURE_GPT41_KEY: ${{ secrets.AZURE_GPT41_KEY }}
          AZURE_PHI4_ENDPOINT: ${{ secrets.AZURE_PHI4_ENDPOINT }}
          AZURE_PHI4_KEY: ${{ secrets.AZURE_PHI4_KEY }}
          AZURE_GROK_ENDPOINT: ${{ secrets.AZURE_GROK_ENDPOINT }}
          AZURE_GROK_KEY: ${{ secrets.AZURE_GROK_KEY }}
        run: |
          NAME_PREFIX="genup-${ENVIRONMENT}"
          FN_NAME="${NAME_PREFIX}-agent_orchestrator"

          echo "Updating Azure AI env vars on ${FN_NAME}..."

          # Get current env vars and merge in Azure AI credentials
          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FN_NAME" \
            --query 'Environment.Variables' \
            --output json 2>/dev/null || echo '{}')

          # Merge Azure AI env vars into existing config
          UPDATED_ENV=$(echo "$CURRENT_ENV" | python3 -c "
          import json, sys, os
          env = json.load(sys.stdin)
          env['AZURE_AI_ENDPOINT'] = os.environ.get('AZURE_AI_ENDPOINT', '')
          env['AZURE_AI_KEY'] = os.environ.get('AZURE_AI_KEY', '')
          env['AZURE_DEEPSEEK_ENDPOINT'] = os.environ.get('AZURE_DEEPSEEK_ENDPOINT', '')
          env['AZURE_DEEPSEEK_KEY'] = os.environ.get('AZURE_DEEPSEEK_KEY', '')
          env['AZURE_MISTRAL_ENDPOINT'] = os.environ.get('AZURE_MISTRAL_ENDPOINT', '')
          env['AZURE_MISTRAL_KEY'] = os.environ.get('AZURE_MISTRAL_KEY', '')
          env['AZURE_GPT4O_ENDPOINT'] = os.environ.get('AZURE_GPT4O_ENDPOINT', '')
          env['AZURE_GPT4O_KEY'] = os.environ.get('AZURE_GPT4O_KEY', '')
          env['AZURE_COHERE_ENDPOINT'] = os.environ.get('AZURE_COHERE_ENDPOINT', '')
          env['AZURE_COHERE_KEY'] = os.environ.get('AZURE_COHERE_KEY', '')
          env['AZURE_KIMI_ENDPOINT'] = os.environ.get('AZURE_KIMI_ENDPOINT', '')
          env['AZURE_KIMI_KEY'] = os.environ.get('AZURE_KIMI_KEY', '')
          env['AZURE_O3MINI_ENDPOINT'] = os.environ.get('AZURE_O3MINI_ENDPOINT', '')
          env['AZURE_O3MINI_KEY'] = os.environ.get('AZURE_O3MINI_KEY', '')
          env['AZURE_GPT41_ENDPOINT'] = os.environ.get('AZURE_GPT41_ENDPOINT', '')
          env['AZURE_GPT41_KEY'] = os.environ.get('AZURE_GPT41_KEY', '')
          env['AZURE_PHI4_ENDPOINT'] = os.environ.get('AZURE_PHI4_ENDPOINT', '')
          env['AZURE_PHI4_KEY'] = os.environ.get('AZURE_PHI4_KEY', '')
          env['AZURE_GROK_ENDPOINT'] = os.environ.get('AZURE_GROK_ENDPOINT', '')
          env['AZURE_GROK_KEY'] = os.environ.get('AZURE_GROK_KEY', '')
          print(json.dumps({'Variables': env}))
          ")

          aws lambda update-function-configuration \
            --function-name "$FN_NAME" \
            --environment "$UPDATED_ENV" \
            --no-cli-pager 2>/dev/null

          echo "Azure AI env vars updated on ${FN_NAME}"

          # Wait for update to complete
          aws lambda wait function-updated --function-name "$FN_NAME" 2>/dev/null || true
          echo "Lambda configuration update complete"

      - name: Get Outputs
        id: outputs
        working-directory: infrastructure/terraform
        run: |
          echo "CLOUDFRONT_DOMAIN=$(terraform output -raw cloudfront_domain_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "API_ENDPOINT=$(terraform output -raw api_gateway_endpoint 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "BUCKET_NAME=$(terraform output -raw bucket_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## humanovo Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ steps.outputs.outputs.BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: https://${{ steps.outputs.outputs.CLOUDFRONT_DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Gateway**: ${{ steps.outputs.outputs.API_ENDPOINT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Lambda Functions Deployed" >> $GITHUB_STEP_SUMMARY
          echo "All Lambda handlers packaged from \`backend/lambda/handlers/\` and deployed." >> $GITHUB_STEP_SUMMARY
