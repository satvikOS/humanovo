name: Deploy GenUp Infrastructure

on:
  push:
    branches:
      - main
      - 'claude/*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      cleanup:
        description: 'Clean up orphaned resources before deploy'
        required: false
        default: 'true'
        type: boolean

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.5.7'

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Cleanup Orphaned Resources
        if: ${{ github.event.inputs.cleanup != 'false' }}
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "Cleaning up orphaned resources..."
          echo "=========================================="

          # Delete orphaned DynamoDB tables
          echo "Deleting DynamoDB tables..."
          for table in genup-dev-projects genup-dev-hypotheses genup-dev-evidence genup-dev-simulations genup-dev-knowledge-metadata genup-dev-agent-tasks; do
            echo "Deleting table: $table"
            aws dynamodb delete-table --table-name $table 2>/dev/null || true
          done

          # Delete orphaned CloudWatch log groups
          echo "Deleting CloudWatch log groups..."
          for log_group in /aws/genup/dev /aws/apigateway/genup-dev-api; do
            echo "Deleting log group: $log_group"
            aws logs delete-log-group --log-group-name $log_group 2>/dev/null || true
          done

          # Delete Lambda function log groups
          for func in api_core projects hypotheses evidence knowledge hypothesis_generation agent_orchestrator search_agent embeddings simulation simulation_worker ingestion pubmed_fetcher clinical_trials_fetcher; do
            echo "Deleting log group: /aws/lambda/genup-dev-$func"
            aws logs delete-log-group --log-group-name "/aws/lambda/genup-dev-$func" 2>/dev/null || true
          done

          # Delete orphaned IAM roles
          echo "Deleting IAM roles..."
          for role in genup-dev-lambda-execution genup-dev-api-gateway genup-dev-deployment; do
            echo "Processing role: $role"
            # Delete inline policies
            aws iam list-role-policies --role-name $role 2>/dev/null | jq -r '.PolicyNames[]' 2>/dev/null | while read policy; do
              echo "  Deleting inline policy: $policy"
              aws iam delete-role-policy --role-name $role --policy-name "$policy" 2>/dev/null || true
            done
            # Detach managed policies
            aws iam list-attached-role-policies --role-name $role 2>/dev/null | jq -r '.AttachedPolicies[].PolicyArn' 2>/dev/null | while read policy; do
              echo "  Detaching managed policy: $policy"
              aws iam detach-role-policy --role-name $role --policy-arn "$policy" 2>/dev/null || true
            done
            # Delete role
            aws iam delete-role --role-name $role 2>/dev/null || true
          done

          # Delete orphaned KMS alias
          echo "Deleting KMS alias..."
          aws kms delete-alias --alias-name alias/genup-dev 2>/dev/null || true

          # Delete orphaned SQS queues
          echo "Deleting SQS queues..."
          for queue_name in genup-dev-simulation-dlq genup-dev-simulation-queue; do
            QUEUE_URL=$(aws sqs get-queue-url --queue-name $queue_name 2>/dev/null | jq -r '.QueueUrl') || true
            if [ -n "$QUEUE_URL" ] && [ "$QUEUE_URL" != "null" ]; then
              echo "Deleting queue: $queue_name"
              aws sqs delete-queue --queue-url "$QUEUE_URL" 2>/dev/null || true
            fi
          done

          # Delete orphaned CloudFront function
          echo "Deleting CloudFront function..."
          FUNCTION_ETAG=$(aws cloudfront describe-function --name genup-dev-spa-routing 2>/dev/null | jq -r '.ETag') || true
          if [ -n "$FUNCTION_ETAG" ] && [ "$FUNCTION_ETAG" != "null" ]; then
            aws cloudfront delete-function --name genup-dev-spa-routing --if-match "$FUNCTION_ETAG" 2>/dev/null || true
          fi

          # Delete orphaned CloudFront OAC
          echo "Deleting CloudFront OAC..."
          OAC_ID=$(aws cloudfront list-origin-access-controls 2>/dev/null | jq -r '.OriginAccessControlList.Items[] | select(.Name=="genup-dev-frontend-oac") | .Id') || true
          if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "null" ]; then
            OAC_ETAG=$(aws cloudfront get-origin-access-control --id "$OAC_ID" 2>/dev/null | jq -r '.ETag') || true
            aws cloudfront delete-origin-access-control --id "$OAC_ID" --if-match "$OAC_ETAG" 2>/dev/null || true
          fi

          # Delete orphaned WAF WebACL
          echo "Deleting WAF WebACL..."
          WAF_ID=$(aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 2>/dev/null | jq -r '.WebACLs[] | select(.Name=="genup-dev-waf") | .Id') || true
          if [ -n "$WAF_ID" ] && [ "$WAF_ID" != "null" ]; then
            WAF_TOKEN=$(aws wafv2 get-web-acl --name genup-dev-waf --scope CLOUDFRONT --id "$WAF_ID" --region us-east-1 2>/dev/null | jq -r '.LockToken') || true
            aws wafv2 delete-web-acl --name genup-dev-waf --scope CLOUDFRONT --id "$WAF_ID" --lock-token "$WAF_TOKEN" --region us-east-1 2>/dev/null || true
          fi

          # Delete orphaned Secrets Manager secrets
          echo "Deleting Secrets Manager secrets..."
          aws secretsmanager list-secrets --filter Key=name,Values=genup-dev-api-keys 2>/dev/null | jq -r '.SecretList[].ARN' 2>/dev/null | while read secret_arn; do
            echo "Deleting secret: $secret_arn"
            aws secretsmanager delete-secret --secret-id "$secret_arn" --force-delete-without-recovery 2>/dev/null || true
          done

          echo "=========================================="
          echo "Cleanup complete!"
          echo "=========================================="

      - name: Wait for resource deletion
        if: ${{ github.event.inputs.cleanup != 'false' }}
        run: |
          echo "Waiting 60 seconds for resources to be fully deleted..."
          sleep 60

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        run: terraform plan -var-file=environments/dev.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Outputs
        working-directory: infrastructure/terraform
        run: |
          echo "## Deployment Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CloudFront Domain | $(terraform output -raw cloudfront_domain_name 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| API Gateway URL | $(terraform output -raw api_gateway_stage_url 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Bucket | $(terraform output -raw frontend_bucket_name 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
