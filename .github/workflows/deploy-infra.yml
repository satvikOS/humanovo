name: Deploy GenUp Infrastructure

on:
  push:
    branches:
      - main
      - 'claude/*'
    paths:
      - 'infrastructure/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.5.7'
  # Terraform state infrastructure
  TF_STATE_BUCKET: genup-terraform-state
  TF_LOCK_TABLE: genup-terraform-locks
  # Environment suffix for resource names
  ENVIRONMENT: dev

jobs:
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform State Infrastructure
        run: |
          # Create terraform state bucket if it doesn't exist
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Creating Terraform state bucket: $TF_STATE_BUCKET"
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"

            # Enable versioning
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled

            # Enable encryption
            aws s3api put-bucket-encryption --bucket "$TF_STATE_BUCKET" \
              --server-side-encryption-configuration '{
                "Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]
              }'

            # Block public access
            aws s3api put-public-access-block --bucket "$TF_STATE_BUCKET" \
              --public-access-block-configuration '{
                "BlockPublicAcls": true,
                "IgnorePublicAcls": true,
                "BlockPublicPolicy": true,
                "RestrictPublicBuckets": true
              }'
          fi

          # Create DynamoDB table for state locking if it doesn't exist
          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" 2>/dev/null; then
            echo "Creating Terraform lock table: $TF_LOCK_TABLE"
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --tags Key=Purpose,Value="Terraform state locking"

            # Wait for table to be active
            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE"
          fi

          echo "Terraform state infrastructure ready"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=infrastructure/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Import Existing Resources
        working-directory: infrastructure/terraform
        continue-on-error: true
        run: |
          # This step imports any existing AWS resources into Terraform state
          # It runs with continue-on-error since resources may not exist or already be in state

          echo "Attempting to import existing resources into Terraform state..."

          # Import KMS alias (if exists)
          terraform import -var-file=environments/dev.tfvars \
            'aws_kms_alias.main' 'alias/genup-dev' 2>/dev/null || true

          # Import main CloudWatch log group
          terraform import -var-file=environments/dev.tfvars \
            'aws_cloudwatch_log_group.main' '/aws/genup/dev' 2>/dev/null || true

          # Import API Gateway log group
          terraform import -var-file=environments/dev.tfvars \
            'module.api_gateway.aws_cloudwatch_log_group.api_gateway' '/aws/apigateway/genup-dev-api' 2>/dev/null || true

          # Import DynamoDB tables
          for table in projects hypotheses evidence simulations knowledge-metadata agent-tasks; do
            terraform import -var-file=environments/dev.tfvars \
              "module.dynamodb.aws_dynamodb_table.${table//-/_}" "genup-dev-${table}" 2>/dev/null || true
          done

          # Import IAM roles
          terraform import -var-file=environments/dev.tfvars \
            'module.iam.aws_iam_role.lambda_execution' 'genup-dev-lambda-execution' 2>/dev/null || true
          terraform import -var-file=environments/dev.tfvars \
            'module.iam.aws_iam_role.api_gateway' 'genup-dev-api-gateway' 2>/dev/null || true
          terraform import -var-file=environments/dev.tfvars \
            'module.iam.aws_iam_role.deployment' 'genup-dev-deployment' 2>/dev/null || true

          # Import Lambda CloudWatch log groups
          for fn in api_core projects hypotheses evidence knowledge hypothesis_generation agent_orchestrator search_agent embeddings simulation simulation_worker ingestion pubmed_fetcher clinical_trials_fetcher; do
            terraform import -var-file=environments/dev.tfvars \
              "module.lambda.aws_cloudwatch_log_group.lambda_logs[\"${fn}\"]" "/aws/lambda/genup-dev-${fn}" 2>/dev/null || true
          done

          # Import SQS queues
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform import -var-file=environments/dev.tfvars \
            'module.lambda.aws_sqs_queue.simulation_dlq' "https://sqs.${AWS_REGION}.amazonaws.com/${AWS_ACCOUNT_ID}/genup-dev-simulation-dlq" 2>/dev/null || true
          terraform import -var-file=environments/dev.tfvars \
            'module.lambda.aws_sqs_queue.simulation_queue' "https://sqs.${AWS_REGION}.amazonaws.com/${AWS_ACCOUNT_ID}/genup-dev-simulation-queue" 2>/dev/null || true

          echo "Resource import complete (errors above are expected for resources that don't exist or are already imported)"

      - name: Terraform Plan - S3 Buckets First
        working-directory: infrastructure/terraform
        run: |
          # First, create just the S3 buckets so we can upload Lambda layers
          terraform plan \
            -var-file=environments/dev.tfvars \
            -target=module.s3 \
            -out=tfplan-s3 \
            -input=false

      - name: Terraform Apply - S3 Buckets
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan-s3

      - name: Get Unified Bucket Name
        id: get-bucket
        working-directory: infrastructure/terraform
        run: |
          GENUP_BUCKET=$(terraform output -raw bucket_name 2>/dev/null || echo "genup-${ENVIRONMENT}")
          echo "GENUP_BUCKET=$GENUP_BUCKET" >> $GITHUB_OUTPUT
          echo "Unified bucket: $GENUP_BUCKET"

      - name: Upload Lambda Layer Placeholders
        run: |
          GENUP_BUCKET="${{ steps.get-bucket.outputs.GENUP_BUCKET }}"

          # Create minimal placeholder for Lambda layers
          mkdir -p /tmp/lambda/python
          echo "# placeholder" > /tmp/lambda/python/__init__.py
          cd /tmp/lambda && zip -r ../layer.zip python/

          # Upload both required layers to artifacts/ prefix
          echo "Uploading Lambda layers to s3://$GENUP_BUCKET/artifacts/"
          aws s3 cp /tmp/layer.zip "s3://$GENUP_BUCKET/artifacts/lambda-layers/dependencies.zip"
          aws s3 cp /tmp/layer.zip "s3://$GENUP_BUCKET/artifacts/lambda-layers/scipy.zip"

          # Create placeholder function
          mkdir -p /tmp/func/handlers
          cat > /tmp/func/handlers/main.py << 'EOF'
          import json
          def handler(event, context):
              return {'statusCode': 200, 'body': json.dumps({'status': 'ok'})}
          EOF
          cd /tmp/func && zip -r ../function.zip handlers/

          # Upload placeholder functions for all Lambda functions
          for fn in api_core projects hypotheses evidence knowledge simulation simulation_worker ingestion hypothesis_generation agent_orchestrator search_agent embeddings pubmed_fetcher clinical_trials_fetcher; do
            aws s3 cp /tmp/function.zip "s3://$GENUP_BUCKET/artifacts/lambda-functions/$fn.zip"
          done

          echo "Lambda placeholders uploaded successfully"

      - name: Terraform Plan - Full Infrastructure
        working-directory: infrastructure/terraform
        run: |
          terraform plan \
            -var-file=environments/dev.tfvars \
            -out=tfplan \
            -input=false

      - name: Terraform Apply - Full Infrastructure
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Outputs
        id: outputs
        working-directory: infrastructure/terraform
        run: |
          echo "CLOUDFRONT_DOMAIN=$(terraform output -raw cloudfront_domain_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "API_ENDPOINT=$(terraform output -raw api_gateway_endpoint 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "BUCKET_NAME=$(terraform output -raw bucket_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Infrastructure Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unified Storage" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket**: ${{ steps.outputs.outputs.BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "  - Frontend: \`/frontend/\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Data: \`/data/\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Artifacts: \`/artifacts/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: ${{ steps.outputs.outputs.CLOUDFRONT_DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Gateway**: ${{ steps.outputs.outputs.API_ENDPOINT }}" >> $GITHUB_STEP_SUMMARY
