name: Deploy GenUp Infrastructure

on:
  push:
    branches:
      - main
      - 'claude/*'
    paths:
      - 'infrastructure/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.5.7'
  # Fixed bucket names - consistent across all deployments
  ARTIFACTS_BUCKET: genup-artifacts-bucket
  FRONTEND_BUCKET: genup-frontend-bucket

jobs:
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup S3 Buckets
        run: |
          # Create artifacts bucket if needed
          aws s3api head-bucket --bucket "$ARTIFACTS_BUCKET" 2>/dev/null || \
            aws s3api create-bucket --bucket "$ARTIFACTS_BUCKET" --region $AWS_REGION 2>/dev/null || true

          # Create frontend bucket if needed
          aws s3api head-bucket --bucket "$FRONTEND_BUCKET" 2>/dev/null || \
            aws s3api create-bucket --bucket "$FRONTEND_BUCKET" --region $AWS_REGION 2>/dev/null || true

          echo "S3 buckets ready"

      - name: Upload Lambda Placeholders
        run: |
          # Create minimal placeholder for Lambda functions
          mkdir -p /tmp/lambda/python
          echo "# placeholder" > /tmp/lambda/python/__init__.py
          cd /tmp/lambda && zip -r ../layer.zip python/

          # Upload placeholder layer
          aws s3 cp /tmp/layer.zip "s3://$ARTIFACTS_BUCKET/lambda-layers/dependencies.zip" || true

          # Create placeholder function
          mkdir -p /tmp/func/handlers
          cat > /tmp/func/handlers/main.py << 'EOF'
          import json
          def handler(event, context):
              return {'statusCode': 200, 'body': json.dumps({'status': 'ok'})}
          EOF
          cd /tmp/func && zip -r ../function.zip handlers/

          # Upload placeholder functions
          for fn in api_core projects hypotheses evidence knowledge simulation ingestion; do
            aws s3 cp /tmp/function.zip "s3://$ARTIFACTS_BUCKET/lambda-functions/$fn.zip" || true
          done

          echo "Lambda placeholders uploaded"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        run: terraform plan -var-file=environments/dev.tfvars -out=tfplan -input=false

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Summary
        run: |
          echo "## Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: s3://$ARTIFACTS_BUCKET/" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: s3://$FRONTEND_BUCKET/" >> $GITHUB_STEP_SUMMARY
