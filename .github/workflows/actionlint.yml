name: actionlint

# Static analysis on every workflow file. Catches the common GitHub
# Actions pitfalls that fail at runtime instead of PR-time:
#
#   - SHA-pinned actions whose channel/version is normally read from
#     the ref name (dtolnay/rust-toolchain) and now silently inherits
#     an empty string -> "invalid toolchain name ''" mid-build.
#   - Misuse of ${{ }} in `if:` conditions.
#   - Invalid matrix axes / fail-fast typos.
#   - Shell-injection risk in run: blocks that interpolate
#     untrusted ${{ github.event.* }} values.
#
# Pairs with verify-action-shas.yml (which checks SHA validity);
# actionlint catches the *contract* of each action's inputs, while
# the SHA verifier catches references that won't resolve.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [humanovo, main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install actionlint
        run: |
          # Pin to v1.7.9; download via the rhysd-published script which
          # picks the right OS/arch binary and verifies the checksum.
          # The script accepts (version, dir) as positional args and
          # requires the directory to already exist.
          set -euo pipefail
          VERSION=1.7.9
          BIN_DIR="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$BIN_DIR"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${VERSION}/scripts/download-actionlint.bash" \
            -o "$RUNNER_TEMP/download-actionlint.bash"
          # Sanity: the downloaded script should start with a shebang.
          head -1 "$RUNNER_TEMP/download-actionlint.bash" | grep -q "^#!/" \
            || { echo "downloader script malformed"; exit 1; }
          bash "$RUNNER_TEMP/download-actionlint.bash" "${VERSION}" "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          "$BIN_DIR/actionlint" -version

      - name: Lint workflows
        env:
          # SHELLCHECK_OPTS is read by shellcheck itself when
          # actionlint invokes it. Silences the stylistic noise
          # codes that fire on patterns *intentional* in GitHub
          # Actions:
          #   SC2086  Double quote to prevent globbing/word-splitting.
          #           Triggered on every `${{ var }}` interpolation
          #           even though Actions already escapes the value.
          #   SC2129  Use `{ a; b; } >> file` instead of individual
          #           redirects. Style preference; either is fine.
          #   SC2001  Use ${var//s/r}. Useful tip but flooding logs.
          #   SC2015  A && B || C is not if-then-else. Recognised
          #           idiom in actions for "best-effort cleanup".
          #   SC2046  Quote $() to prevent word splitting. Same kind
          #           of false-positive on Actions outputs as SC2086.
          #   SC2044  For-loop over find output is fragile. The
          #           workflows pass through a known-safe filename set.
          # SC1xxx (real syntax errors) and SC2-codes outside this list
          # remain active, so a genuinely broken script still fails.
          # The previous attempt passed these via actionlint's
          # `-shellcheck=` flag, but that flag expects a binary path,
          # not a command-with-args — actionlint tried to exec a
          # literal `shellcheck -e ...` and the workflow died with
          # "exec format error" before linting anything.
          SHELLCHECK_OPTS: "-e SC2086,SC2129,SC2001,SC2015,SC2046,SC2044"
        run: |
          # actionlint's -color flag is a boolean (no value). The
          # earlier `-color always` invocation made actionlint treat
          # `always` as a workflow file path and fail. GitHub Actions
          # already strips ANSI on its log viewer when needed; -color
          # with no argument forces colour output for terminal-side
          # debugging.
          actionlint -color
