name: Bootstrap Backend (VPC + Aurora + Lambda + API GW, NEW account)

# Provisions the full backend stack in the *new* AWS business account:
# VPC + 2 AZs of subnets, Aurora Serverless v2, ElastiCache Serverless,
# RDS Proxy, ECR repo, Lambda function, HTTP API Gateway with the
# api.humanovo.net custom domain. Idempotent — safe to re-run.
#
# Output: the API Gateway custom domain URL is printed to the run
# summary in big bold letters.
#
# Manual-only — do NOT auto-trigger. Provisioning new infra (Aurora,
# ElastiCache, NAT) costs real money and shouldn't fire on every commit.
#
# Prerequisites (in repo Settings → Secrets):
#   AWS_NEW_ACCESS_KEY_ID
#   AWS_NEW_SECRET_ACCESS_KEY
# (kept distinct from the legacy AWS_ACCESS_KEY_ID / *_SECRET_ACCESS_KEY
# pair so a half-migrated state can't accidentally apply to the wrong
# account.)

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS region'
        required: false
        default: 'us-east-1'
      production_nat:
        description: 'NAT layer: false=fck-nat instance ($3/mo), true=managed NAT Gateway ($32/mo)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: bootstrap-backend-prod
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: '1.6.6'
  TF_STATE_BUCKET_PREFIX: humanovo-tf-state
  TF_LOCK_TABLE: humanovo-tf-locks
  TF_WORKING_DIR: infrastructure/terraform/backend

jobs:
  bootstrap:
    name: Provision backend VPC + Aurora + Lambda + API GW
    runs-on: ubuntu-latest
    # 60 min was too short — the first dispatch (run 25947588762) was
    # killed by the timeout mid `terraform apply`, ~60 min in. A cold
    # AWS account provisioning a full VPC + NAT + Aurora cluster +
    # Lambda + API Gateway in one apply routinely needs 60-120 min
    # (Aurora cluster creation alone is 20-40 min). 180 min leaves
    # ample headroom, including for a resumed apply that has to
    # reconcile the partially-created resources from the timed-out run.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Configure AWS credentials (new account)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_NEW_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NEW_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Confirm we're in the new account
        run: |
          aws sts get-caller-identity --output table
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "::notice title=AWS account::Operating in account $ACCOUNT_ID"

      - name: Ensure Terraform state bucket exists
        id: ensure_state
        run: |
          set -e
          REGION="${{ github.event.inputs.aws_region }}"
          BUCKET="${TF_STATE_BUCKET_PREFIX}-${REGION}"
          echo "Checking for state bucket: $BUCKET"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket already exists — reusing."
          else
            echo "Bucket missing — creating..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Ensure Terraform lock table exists
        run: |
          set -e
          REGION="${{ github.event.inputs.aws_region }}"
          if aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" --region "$REGION" >/dev/null 2>&1; then
            echo "Lock table exists — reusing."
          else
            echo "Creating lock table $TF_LOCK_TABLE..."
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE" --region "$REGION"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        # Backend config is hardcoded in main.tf, but we still need to
        # call init to download providers + the s3 backend module.
        run: |
          terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        # The first bootstrap dispatch was SIGKILLed by the job
        # timeout mid-apply. terraform releases its DynamoDB state
        # lock only on a clean exit, so a stale lock may still be
        # held. Detect that specific failure, force-unlock (safe —
        # we know the holding run is dead), and retry once. Any
        # other plan failure still aborts.
        run: |
          ARGS=(-no-color -out=tfplan)
          ARGS+=(-var "aws_region=${{ github.event.inputs.aws_region }}")
          ARGS+=(-var "production_nat=${{ github.event.inputs.production_nat }}")
          set +e
          PLAN_OUT="$(terraform plan "${ARGS[@]}" 2>&1)"
          PLAN_RC=$?
          set -e
          echo "$PLAN_OUT"
          if [ "$PLAN_RC" -ne 0 ] && echo "$PLAN_OUT" | grep -q "Error acquiring the state lock"; then
            LOCK_ID="$(echo "$PLAN_OUT" | grep -oE 'ID:[[:space:]]+[0-9a-fA-F-]+' | head -1 | awk '{print $2}')"
            if [ -n "$LOCK_ID" ]; then
              echo "::warning::Stale terraform state lock $LOCK_ID — force-unlocking (holder run timed out) and retrying plan."
              terraform force-unlock -force "$LOCK_ID"
              terraform plan "${ARGS[@]}"
            else
              echo "Lock error but could not parse lock ID."
              exit 1
            fi
          elif [ "$PLAN_RC" -ne 0 ]; then
            exit "$PLAN_RC"
          fi

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve -no-color tfplan

      - name: Capture outputs
        id: tf_outputs
        if: always()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          # `if: always()` so we still try to recover URLs even if a
          # later optional step blew up. The capture itself can fail
          # cleanly (set +e) so a missing output doesn't kill the job
          # before we've printed anything useful.
          set +e
          API_URL=$(terraform output -raw api_gateway_url 2>/dev/null)
          API_DOMAIN=$(terraform output -raw api_gateway_custom_domain 2>/dev/null)
          LAMBDA_NAME=$(terraform output -raw lambda_function_name 2>/dev/null)
          LAMBDA_ARN=$(terraform output -raw lambda_function_arn 2>/dev/null)
          ECR_URL=$(terraform output -raw ecr_repository_url 2>/dev/null)
          DB_ENDPOINT=$(terraform output -raw aurora_cluster_endpoint 2>/dev/null)
          REDIS_ENDPOINT=$(terraform output -raw redis_endpoint 2>/dev/null)
          SECRETS_NAME=$(terraform output -raw secrets_manager_app_name 2>/dev/null)
          VPC_ID=$(terraform output -raw vpc_id 2>/dev/null)

          {
            echo "api_url=$API_URL"
            echo "api_domain=$API_DOMAIN"
            echo "lambda_name=$LAMBDA_NAME"
            echo "lambda_arn=$LAMBDA_ARN"
            echo "ecr_url=$ECR_URL"
            echo "db_endpoint=$DB_ENDPOINT"
            echo "redis_endpoint=$REDIS_ENDPOINT"
            echo "secrets_name=$SECRETS_NAME"
            echo "vpc_id=$VPC_ID"
          } >> "$GITHUB_OUTPUT"

          # Also dump straight to the run log so the URL shows up in
          # the per-job output, not only in the Summary tab.
          echo ""
          echo "==================================================================="
          if [ -n "$API_DOMAIN" ]; then
            echo "  API URL:         ${API_DOMAIN}"
          else
            echo "  API URL:         (terraform output not available yet)"
          fi
          echo "  ECR repo:        ${ECR_URL:-(unknown)}"
          echo "  Lambda fn:       ${LAMBDA_NAME:-(unknown)}"
          echo "  Aurora endpoint: ${DB_ENDPOINT:-(unknown)}"
          echo "  Redis endpoint:  ${REDIS_ENDPOINT:-(unknown)}"
          echo "==================================================================="
          echo ""

      - name: Print results to job summary
        if: always()
        run: |
          API_URL="${{ steps.tf_outputs.outputs.api_url }}"
          API_DOMAIN="${{ steps.tf_outputs.outputs.api_domain }}"
          LAMBDA_NAME="${{ steps.tf_outputs.outputs.lambda_name }}"
          LAMBDA_ARN="${{ steps.tf_outputs.outputs.lambda_arn }}"
          ECR_URL="${{ steps.tf_outputs.outputs.ecr_url }}"
          DB_ENDPOINT="${{ steps.tf_outputs.outputs.db_endpoint }}"
          REDIS_ENDPOINT="${{ steps.tf_outputs.outputs.redis_endpoint }}"
          SECRETS_NAME="${{ steps.tf_outputs.outputs.secrets_name }}"
          VPC_ID="${{ steps.tf_outputs.outputs.vpc_id }}"

          {
            echo "## humanovo Backend — NEW AWS Account"
            echo ""
            if [ -n "$API_DOMAIN" ]; then
              echo "### API URL"
              echo ""
              echo "**${API_DOMAIN}**"
              echo ""
              echo "DNS for \`api.humanovo.net\` is created in this stack via Route 53"
              echo "ALIAS records pointing at the regional API Gateway endpoint."
              echo "Cert validation may take a couple of minutes on first apply."
              echo ""
              echo "Direct invoke URL (no custom domain): \`${API_URL:-not captured}\`"
            else
              echo "### Could not capture API Gateway URL"
              echo ""
              echo "Terraform did not return an \`api_gateway_custom_domain\` output. Likely causes:"
              echo "  - The apply step failed before reaching the apigw resource"
              echo "  - State backend mismatch (different region or environment)"
              echo "  - ACM cert validation hung (re-run after a few minutes)"
              echo ""
              echo "Re-run with debug logs enabled (Actions → Run workflow → Enable debug logging)."
            fi
            echo ""
            echo "### Stack details"
            echo ""
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| AWS Account | \`${ACCOUNT_ID:-unknown}\` |"
            echo "| Region | \`${{ github.event.inputs.aws_region }}\` |"
            echo "| Environment | \`prod\` |"
            echo "| VPC ID | \`${VPC_ID:-not captured}\` |"
            echo "| Lambda function | \`${LAMBDA_NAME:-not captured}\` |"
            echo "| Lambda ARN | \`${LAMBDA_ARN:-not captured}\` |"
            echo "| ECR repository | \`${ECR_URL:-not captured}\` |"
            echo "| Aurora (RDS Proxy) | \`${DB_ENDPOINT:-not captured}\` |"
            echo "| Redis | \`${REDIS_ENDPOINT:-not captured}\` |"
            echo "| App secrets | \`${SECRETS_NAME:-not captured}\` |"
            echo "| Terraform state | \`${TF_STATE_BUCKET:-unknown}/backend/prod/terraform.tfstate\` |"
            echo ""
            if [ -n "$API_DOMAIN" ] && [ -n "$ECR_URL" ]; then
              echo "### Next steps"
              echo ""
              echo "1. Fill in the REPLACE_ME values in Secrets Manager (\`${SECRETS_NAME}\`):"
              echo "   - \`stripe_secret_key\`, \`anthropic_api_key\`, \`openai_api_key\`,"
              echo "     and the three \`auth0_*\` fields. Use the AWS console; the"
              echo "     Terraform secret_version has \`ignore_changes = [secret_string]\`"
              echo "     so it won't clobber edits."
              echo "2. Push the first real backend image — run the **Deploy Backend**"
              echo "   workflow (\`deploy-backend-new-account.yml\`). It will build,"
              echo "   push to \`${ECR_URL}\`, and patch the Lambda."
              echo "3. Test: \`curl ${API_DOMAIN}/health\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "==================================================================="
          if [ -n "$API_DOMAIN" ]; then
            echo "  API URL:  ${API_DOMAIN}"
          else
            echo "  API URL:  (not available — see job summary)"
          fi
          echo "==================================================================="
          echo ""
