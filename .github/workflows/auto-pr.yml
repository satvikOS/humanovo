name: Auto Create PR to Main

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create PR if missing
    runs-on: ubuntu-latest

    steps:
      - name: Create PR
        uses: actions/github-script@v7
        with:
          script: |
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';

            if (head === base) {
              core.info('Skipping PR creation for main branch.');
              return;
            }

            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base,
            });

            if (existing.length > 0) {
              core.info(`PR already exists for ${head} -> ${base}.`);
              return;
            }

            const title = `Auto PR: ${head} -> ${base}`;
            const body = [
              'This PR was auto-created on push.',
              '',
              `Source: \`${head}\``,
              `Target: \`${base}\``,
            ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head,
              base,
              title,
              body,
              maintainer_can_modify: true,
            });

            core.info(`Created PR #${pr.number}`);
