name: Inspect + Fix API Gateway -> Lambda

# The backend Lambda returns a valid 200 when invoked directly, but the
# live API Gateway endpoint 500s with {"message":"Internal Server
# Error"} — i.e. the API Gateway -> Lambda integration is broken.
# This dumps the Lambda resource policy + the HTTP API integration, and
# (re-)grants apigateway.amazonaws.com permission to invoke the Lambda.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  LAMBDA_NAME: humanovo-backend-prod
  API_ID: jhknjpjise

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (new account)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_NEW_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NEW_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inspect current state
        run: |
          ACCT=$(aws sts get-caller-identity --query Account --output text)
          echo "account=$ACCT"
          echo "=== Lambda resource policy ==="
          aws lambda get-policy --function-name "$LAMBDA_NAME" \
            --region "$AWS_REGION" --output text 2>&1 || echo "(no policy)"
          echo ""
          echo "=== Lambda function state ==="
          aws lambda get-function-configuration --function-name "$LAMBDA_NAME" \
            --region "$AWS_REGION" \
            --query '{State:State,LastUpdateStatus:LastUpdateStatus,Timeout:Timeout}' \
            --output json
          echo ""
          echo "=== API Gateway integrations ==="
          aws apigatewayv2 get-integrations --api-id "$API_ID" \
            --region "$AWS_REGION" --output json 2>&1 || echo "(none)"
          echo ""
          echo "=== API Gateway routes ==="
          aws apigatewayv2 get-routes --api-id "$API_ID" \
            --region "$AWS_REGION" --output json 2>&1 || echo "(none)"
          echo ""
          echo "=== API Gateway stages ==="
          aws apigatewayv2 get-stages --api-id "$API_ID" \
            --region "$AWS_REGION" --output json 2>&1 || echo "(none)"

      - name: Re-grant API Gateway invoke permission
        run: |
          ACCT=$(aws sts get-caller-identity --query Account --output text)
          SRC_ARN="arn:aws:execute-api:${AWS_REGION}:${ACCT}:${API_ID}/*/*"
          echo "Granting invoke for $SRC_ARN"
          aws lambda add-permission \
            --function-name "$LAMBDA_NAME" \
            --region "$AWS_REGION" \
            --statement-id "apigw-invoke-manual-v1" \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "$SRC_ARN" 2>&1 \
            || echo "(add-permission returned non-zero — likely already exists)"
          echo ""
          echo "=== resource policy after ==="
          aws lambda get-policy --function-name "$LAMBDA_NAME" \
            --region "$AWS_REGION" --output text 2>&1 || echo "(no policy)"
