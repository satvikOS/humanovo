name: Deploy GenUp

on:
  push:
    branches:
      - main
      - 'claude/*'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  FRONTEND_PREFIX: frontend
  ARTIFACTS_PREFIX: artifacts

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check backend/ || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Discover GenUp bucket
        id: bucket
        run: |
          # Find the GenUp unified bucket (pattern: genup-{env}-{suffix})
          GENUP_BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'genup-${ENVIRONMENT}-')].Name | [0]" --output text)

          if [ -z "$GENUP_BUCKET" ] || [ "$GENUP_BUCKET" = "None" ]; then
            echo "ERROR: GenUp bucket not found. Run the infrastructure deployment first."
            echo "Expected bucket pattern: genup-${ENVIRONMENT}-*"
            exit 1
          fi

          echo "GENUP_BUCKET=$GENUP_BUCKET" >> $GITHUB_OUTPUT
          echo "Found bucket: $GENUP_BUCKET"

      - name: Deploy Frontend to S3
        run: |
          GENUP_BUCKET="${{ steps.bucket.outputs.GENUP_BUCKET }}"
          aws s3 sync frontend/dist/ "s3://$GENUP_BUCKET/$FRONTEND_PREFIX/" --delete
          echo "Frontend deployed to s3://$GENUP_BUCKET/$FRONTEND_PREFIX/"

      - name: Invalidate CloudFront Cache
        id: invalidate
        run: |
          # Find the CloudFront distribution for GenUp
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?contains(DomainName, 'genup-${ENVIRONMENT}')]].Id | [0]" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "WARNING: CloudFront distribution not found, skipping invalidation"
            echo "CLOUDFRONT_URL=N/A" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Invalidating CloudFront cache for distribution: $DISTRIBUTION_ID"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)

          echo "Created invalidation: $INVALIDATION_ID"

          # Get the CloudFront domain
          CLOUDFRONT_DOMAIN=$(aws cloudfront get-distribution \
            --id "$DISTRIBUTION_ID" \
            --query "Distribution.DomainName" \
            --output text)

          echo "CLOUDFRONT_URL=https://$CLOUDFRONT_DOMAIN" >> $GITHUB_OUTPUT
          echo "DISTRIBUTION_ID=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          GENUP_BUCKET="${{ steps.bucket.outputs.GENUP_BUCKET }}"
          CLOUDFRONT_URL="${{ steps.invalidate.outputs.CLOUDFRONT_URL }}"
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Storage" >> $GITHUB_STEP_SUMMARY
          echo "- Unified Bucket: \`s3://$GENUP_BUCKET/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`s3://$GENUP_BUCKET/$FRONTEND_PREFIX/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Live URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Site**: $CLOUDFRONT_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "CloudFront cache invalidated - changes should be live within 1-2 minutes." >> $GITHUB_STEP_SUMMARY
