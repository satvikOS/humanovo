name: Deploy humanovo

on:
  push:
    branches:
      - main
      - 'claude/*'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Find bucket
        id: bucket
        run: |
          BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'genup-${ENVIRONMENT}-')].Name | [0]" --output text)
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "ERROR: Bucket not found"
            exit 1
          fi
          echo "BUCKET=$BUCKET" >> $GITHUB_OUTPUT
          echo "Found bucket: $BUCKET"

      - name: Deploy to S3
        run: |
          BUCKET="${{ steps.bucket.outputs.BUCKET }}"

          # 1. Upload index.html with no-cache so browsers ALWAYS revalidate
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --sse AES256 \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

          # 2. Upload hashed assets with immutable cache (filenames change per build)
          if [ -d dist/assets ]; then
            aws s3 sync dist/assets/ "s3://$BUCKET/assets/" \
              --sse AES256 \
              --cache-control "public, max-age=31536000, immutable"
          fi

          # 3. Sync remaining files (favicon, manifest, etc.)
          aws s3 sync dist/ "s3://$BUCKET/" \
            --sse AES256 \
            --cache-control "no-cache" \
            --exclude "index.html" \
            --exclude "assets/*"

          echo "Deployed to s3://$BUCKET/"

      - name: Invalidate CloudFront and wait
        id: cloudfront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?contains(DomainName, 'genup-${ENVIRONMENT}')]].Id | [0]" \
            --output text)

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "No CloudFront distribution found"
            exit 0
          fi

          echo "DIST_ID=$DIST_ID" >> $GITHUB_OUTPUT

          # Create invalidation for ALL paths
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*" \
            --query "Invalidation.Id" --output text)

          echo "Waiting for invalidation $INVALIDATION_ID to propagate..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DIST_ID" \
            --id "$INVALIDATION_ID"
          echo "Invalidation complete."

          DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query "Distribution.DomainName" --output text)
          echo "URL=https://$DOMAIN" >> $GITHUB_OUTPUT

      - name: Verify deployment
        run: |
          BUCKET="${{ steps.bucket.outputs.BUCKET }}"
          URL="${{ steps.cloudfront.outputs.URL }}"

          # Verify S3 headers
          echo "=== S3 index.html headers ==="
          aws s3api head-object --bucket "$BUCKET" --key "index.html" \
            --query '{CacheControl: CacheControl, ContentLength: ContentLength, LastModified: LastModified}' \
            --output table

          # Verify CloudFront is serving fresh content
          if [ -n "$URL" ]; then
            echo ""
            echo "=== CloudFront response headers ==="
            curl -sI "$URL" | grep -iE '(cache-control|x-cache|age|content-type|last-modified)' || true
            echo ""
            echo "=== Deployed title ==="
            curl -s "$URL" | grep -oP '(?<=<title>).*(?=</title>)' || true
          fi

          echo ""
          echo "Live at: $URL"

      - name: Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Bucket: \`${{ steps.bucket.outputs.BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.cloudfront.outputs.URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Cache-Control: \`no-cache, no-store, must-revalidate\` on index.html" >> $GITHUB_STEP_SUMMARY
          echo "- CloudFront invalidation: completed" >> $GITHUB_STEP_SUMMARY
