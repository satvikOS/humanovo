name: Deploy GenUp

on:
  push:
    branches:
      - main
      - 'claude/*'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Find bucket
        id: bucket
        run: |
          BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'genup-${ENVIRONMENT}-')].Name | [0]" --output text)
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "ERROR: Bucket not found"
            exit 1
          fi
          echo "BUCKET=$BUCKET" >> $GITHUB_OUTPUT
          echo "Found bucket: $BUCKET"

      - name: Deploy to S3
        run: |
          BUCKET="${{ steps.bucket.outputs.BUCKET }}"

          # Sync frontend files WITHOUT --delete to preserve Lambda artifacts
          # The --delete flag with --exclude doesn't protect excluded files from deletion
          aws s3 sync dist/ "s3://$BUCKET/" --sse AES256

          echo "Deployed to s3://$BUCKET/"

      - name: Invalidate CloudFront
        id: cloudfront
        run: |
          # Find distribution
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?contains(DomainName, 'genup-${ENVIRONMENT}')]].Id | [0]" \
            --output text)

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "No CloudFront distribution found"
            exit 0
          fi

          # Invalidate cache
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

          # Get URL
          DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query "Distribution.DomainName" --output text)
          echo "URL=https://$DOMAIN" >> $GITHUB_OUTPUT
          echo "Invalidated distribution: $DIST_ID"

      - name: Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Bucket: \`${{ steps.bucket.outputs.BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.cloudfront.outputs.URL }}" >> $GITHUB_STEP_SUMMARY
