name: Deploy GenUp

on:
  push:
    branches:
      - main
      - 'claude/*'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  # Fixed bucket names - these stay consistent across all deployments
  FRONTEND_BUCKET: genup-frontend-bucket
  ARTIFACTS_BUCKET: genup-artifacts-bucket

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check backend/ || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Create S3 buckets if needed
        run: |
          # Create frontend bucket if it doesn't exist
          aws s3api head-bucket --bucket "$FRONTEND_BUCKET" 2>/dev/null || \
            aws s3api create-bucket --bucket "$FRONTEND_BUCKET" --region $AWS_REGION 2>/dev/null || true

          # Create artifacts bucket if it doesn't exist
          aws s3api head-bucket --bucket "$ARTIFACTS_BUCKET" 2>/dev/null || \
            aws s3api create-bucket --bucket "$ARTIFACTS_BUCKET" --region $AWS_REGION 2>/dev/null || true

          echo "Buckets ready"

      - name: Deploy Frontend to S3
        run: |
          aws s3 sync frontend/dist/ "s3://$FRONTEND_BUCKET/" --delete
          echo "Frontend deployed to s3://$FRONTEND_BUCKET/"

      - name: Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: s3://$FRONTEND_BUCKET/" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: s3://$ARTIFACTS_BUCKET/" >> $GITHUB_STEP_SUMMARY
