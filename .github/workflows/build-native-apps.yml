name: Build Native Apps (Win/Mac/Linux)

# Cross-platform Tauri build for the desktop apps users actually
# install. Triggers:
#
#   - tag push  (refs/tags/v*) -> build all 3 platforms + create a
#     GitHub Release with the artifacts attached. Path for shipping:
#     tag the commit, the workflow does the rest.
#   - workflow_dispatch         -> manual build for testing without
#     cutting a release. Artifacts uploaded but no release created.
#
# Build matrix:
#   - macos-latest    -> .app + .dmg (universal: x86_64 + aarch64)
#   - windows-latest  -> .exe + .msi
#   - ubuntu-22.04    -> .deb + .AppImage  (22.04 not 24.04 because of
#                        the libwebkit2gtk-4.1 ABI break)
#
# Code signing: handled via tauri.conf.json platform sections, populated
# from secrets when present. A run with empty signing secrets still
# produces unsigned binaries — useful for developer testing only.
#
# Prerequisite: icon files must exist under frontend/src-tauri/icons/.
# Run `cd frontend && npm run tauri:icon path/to/source.png` once
# locally before the first CI build, OR commit pre-built icons.

on:
  # Auto-build on every push to humanovo. Each push produces a
  # published GitHub Release tagged `auto-{shortSHA}` carrying the 3
  # platform installers PLUS a `latest.json` manifest the Tauri
  # updater plugin (configured in tauri.conf.json) reads to auto-
  # upgrade installed apps in the field.
  #
  # Path filter: skip pushes that don't touch native-buildable code.
  # Backend-only / docs-only changes don't ship a new desktop build.
  push:
    branches:
      - humanovo
    paths:
      - 'frontend/**'
      - '.github/workflows/build-native-apps.yml'
    tags:
      - 'v*'
  # Manual override — release a specific tag without waiting for a
  # push, or do a dispatch-only test build.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: tag to attach the build to (leave blank for dispatch-only build, no release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Per-ref concurrency: a fresh push to humanovo cancels any in-flight
  # auto-build for the same ref. Tag pushes get their own group so they
  # never get cancelled by a regular push.
  group: native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            label: macos-universal
          - platform: ubuntu-22.04
            args: ''
            label: linux-x86_64
          - platform: windows-latest
            args: ''
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust deps
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # libappindicator3-dev was REMOVED from Ubuntu 22.04 — apt-get
          # would exit 100 on it. The Ayatana fork (libayatana-appindicator3-dev)
          # is the supported replacement and is what Tauri 2 looks for.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: Generate placeholder icons if missing
        shell: bash
        run: |
          # Tauri's bundler refuses to build without these files. We
          # generate a placeholder from scripts/generate_placeholder_icon.py
          # (pure-stdlib PNG generator, no Pillow / ImageMagick needed)
          # so the build always succeeds out of the box. Replace
          # frontend/src-tauri/icons/* with branded assets later via:
          #   cd frontend && npm run tauri:icon path/to/source-1024.png
          mkdir -p frontend/src-tauri/icons
          if [ ! -f frontend/src-tauri/icons/icon.png ]; then
            python3 scripts/generate_placeholder_icon.py \
              frontend/src-tauri/icons/icon.png
          fi
          # Tauri CLI fans the source PNG out into all platform sizes
          # (32x32, 128x128, 128x128@2x, icon.icns, icon.ico). Idempotent
          # — if the targets already exist they're regenerated.
          cd frontend
          npx --yes -p @tauri-apps/cli@2 tauri icon \
            src-tauri/icons/icon.png \
            --output src-tauri/icons

      - name: Resolve version + tag for this build
        id: version
        shell: bash
        run: |
          # Three modes:
          #
          #   1. tag push  refs/tags/vX.Y.Z       → use that tag verbatim
          #   2. push to humanovo                  → coin auto-{shortSHA}
          #   3. workflow_dispatch w/ release_tag  → use that tag
          #   4. workflow_dispatch no tag          → empty (artifact-only)
          #
          # The version (without "v" prefix) gets baked into tauri.conf
          # so installed apps can compare against `latest.json` and
          # decide whether to upgrade.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            MODE="tag"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "humanovo" ]]; then
            SHORT="${GITHUB_SHA::8}"
            TAG="auto-${SHORT}"
            BASE="$(node -p "require('./frontend/package.json').version")"
            # NB: build metadata after `+` MUST be numeric-only and
            # ≤ 65535 for the Windows MSI bundler. The hex SHA fails
            # that check, so we use GITHUB_RUN_NUMBER (monotonic, always
            # numeric, easy to reason about) for the version, and keep
            # the SHA in the release tag for traceability.
            VERSION="${BASE}+${GITHUB_RUN_NUMBER}"
            MODE="auto"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            VERSION="${TAG#v}"
            MODE="dispatch-tag"
          else
            TAG=""
            VERSION="0.0.0-dev"
            MODE="dispatch-only"
          fi
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}"       >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=${TAG} version=${VERSION} mode=${MODE}"

      - name: Sync resolved version into tauri.conf.json
        shell: bash
        run: |
          # The `version` in tauri.conf.json is what the updater plugin
          # compares against `latest.json.version` to decide whether to
          # offer an upgrade. Patching it in CI (rather than checking
          # in a constantly-bumping value) keeps the repo clean.
          python3 scripts/set_tauri_version.py "${{ steps.version.outputs.version }}"

      - name: Conditionally enable Tauri updater (when signing keys present)
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          # Updater is disabled in the committed tauri.conf.json so the
          # very first build (with no signing keys configured) succeeds.
          # When the operator generates a Tauri updater keypair and
          # uploads BOTH halves to repo Secrets:
          #   TAURI_SIGNING_PRIVATE_KEY  (consumed by tauri-action env)
          #   TAURI_SIGNING_PUBLIC_KEY   (embedded in the binary so it
          #                                can verify .sig files)
          # …this step injects the updater plugin block + flips
          # createUpdaterArtifacts = true. No code change needed.
          python3 scripts/configure_tauri_updater.py

      - name: Forward signing secrets to env (only when actually set)
        # tauri-action treats any APPLE_CERTIFICATE / TAURI_SIGNING_*
        # env var as a request to sign — even if it's an empty string,
        # which makes `security import` exit 1 with "One or more
        # parameters passed to a function were not valid". GitHub
        # Actions doesn't support per-key conditional env blocks, so
        # we forward each var to GITHUB_ENV only when its source secret
        # is non-empty. Result: a no-secrets repo produces unsigned
        # installers cleanly; a fully-configured repo signs everything.
        shell: bash
        env:
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          _TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          _TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          forward() {
            local name="$1"
            local val="$2"
            if [ -n "$val" ]; then
              # Use the file syntax to avoid log-leaking the secret.
              {
                echo "${name}<<__END__"
                echo "$val"
                echo "__END__"
              } >> "$GITHUB_ENV"
              echo "forwarded: $name (set, $(printf %s "$val" | wc -c) bytes)"
            else
              echo "skipped:   $name (secret unset)"
            fi
          }
          forward APPLE_CERTIFICATE                   "$_APPLE_CERTIFICATE"
          forward APPLE_CERTIFICATE_PASSWORD          "$_APPLE_CERTIFICATE_PASSWORD"
          forward APPLE_SIGNING_IDENTITY              "$_APPLE_SIGNING_IDENTITY"
          forward APPLE_ID                            "$_APPLE_ID"
          forward APPLE_PASSWORD                      "$_APPLE_PASSWORD"
          forward APPLE_TEAM_ID                       "$_APPLE_TEAM_ID"
          forward TAURI_SIGNING_PRIVATE_KEY           "$_TAURI_SIGNING_PRIVATE_KEY"
          forward TAURI_SIGNING_PRIVATE_KEY_PASSWORD  "$_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Build native app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-signing + Tauri-updater secrets are forwarded to env
          # by the previous step ONLY when the corresponding repo secret
          # is non-empty. Empty-secret repos produce unsigned installers
          # without tripping `security import` / signer errors.
        with:
          projectPath: frontend
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: humanovo ${{ steps.version.outputs.version }}
          releaseBody: |
            humanovo ${{ steps.version.outputs.version }} — auto-built from `${{ github.sha }}`.

            Install the artifact matching your OS:
              - macOS:    humanovo_${{ steps.version.outputs.version }}_universal.dmg
              - Windows:  humanovo_${{ steps.version.outputs.version }}_x64-setup.exe (NSIS) or _x64_en-US.msi
              - Linux:    humanovo_${{ steps.version.outputs.version }}_amd64.deb or _amd64.AppImage

            Already installed? The Tauri auto-updater picks this up on next launch.
          # Auto-builds publish straight away — that's the "auto-upgrades
          # the 3 apps" guarantee. Tag pushes / dispatched builds default
          # to draft so a human reviews before shipping.
          releaseDraft: ${{ steps.version.outputs.mode != 'auto' }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Attach stable-name aliases to release
        # Tauri's bundler emits files like humanovo_0.2.0+abcd1234_universal.dmg
        # — version embedded. The landing page (humanovo.net/download/...) needs
        # stable URLs that don't change per release, so we upload a second copy
        # of each artifact under a flat name. Both names point at the same bytes.
        # GitHub's `releases/latest/download/<name>` shortcut then resolves
        # /download/macos -> humanovo_universal.dmg without the landing-page
        # config needing to know the version. Auto-mode only: tag releases and
        # dispatch builds skip this (those have explicit versioned URLs).
        if: steps.version.outputs.mode == 'auto'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BUNDLE_DIR=frontend/src-tauri/target/release/bundle
          declare -A aliases=(
            ["*.dmg"]="humanovo_universal.dmg"
            ["*.msi"]="humanovo_x64_en-US.msi"
            ["*-setup.exe"]="humanovo_x64-setup.exe"
            ["*.deb"]="humanovo_amd64.deb"
            ["*.AppImage"]="humanovo_amd64.AppImage"
          )
          for glob in "${!aliases[@]}"; do
            for src in $(find "$BUNDLE_DIR" -type f -name "$glob" 2>/dev/null); do
              alias_name="${aliases[$glob]}"
              cp "$src" "/tmp/$alias_name"
              echo "Uploading alias: $alias_name (from $src)"
              gh release upload "$TAG" "/tmp/$alias_name" \
                --repo "$GITHUB_REPOSITORY" --clobber
            done
          done

      - name: Upload artifacts (dispatch-only fallback)
        if: steps.version.outputs.mode == 'dispatch-only'
        uses: actions/upload-artifact@v5
        with:
          name: humanovo-${{ matrix.label }}
          path: |
            frontend/src-tauri/target/release/bundle/**/*.dmg
            frontend/src-tauri/target/release/bundle/**/*.msi
            frontend/src-tauri/target/release/bundle/**/*.exe
            frontend/src-tauri/target/release/bundle/**/*.deb
            frontend/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
          retention-days: 14

      - name: Print results to job summary
        shell: bash
        run: |
          MODE="${{ steps.version.outputs.mode }}"
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## humanovo native build — ${{ matrix.label }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Platform | \`${{ matrix.platform }}\` |"
            echo "| Build args | \`${{ matrix.args }}\` |"
            echo "| Mode | \`${MODE}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Tag | \`${TAG:-none}\` |"
            echo ""
            case "${MODE}" in
              auto)
                echo "**Published release:** [Releases ▸ ${TAG}](../../releases/tag/${TAG})"
                echo ""
                echo "Already-installed apps will auto-upgrade on next launch via the Tauri updater plugin."
                ;;
              tag|dispatch-tag)
                echo "Draft release \`${TAG}\` — review + publish in the Releases tab to roll out to installed apps."
                ;;
              dispatch-only)
                echo "Dispatch-only test build. Artifacts under \`humanovo-${{ matrix.label }}\` for 14 days; no release created."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
