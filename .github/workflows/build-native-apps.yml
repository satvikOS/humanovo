name: Build Native Apps (Win/Mac/Linux)

# Cross-platform Tauri build for the desktop apps users actually
# install. Triggers:
#
#   - tag push  (refs/tags/v*) -> build all 3 platforms + create a
#     GitHub Release with the artifacts attached. Path for shipping:
#     tag the commit, the workflow does the rest.
#   - workflow_dispatch         -> manual build for testing without
#     cutting a release. Artifacts uploaded but no release created.
#
# Build matrix:
#   - macos-latest    -> .app + .dmg (universal: x86_64 + aarch64)
#   - windows-2025    -> .exe + .msi
#   - ubuntu-22.04    -> .deb + .AppImage  (22.04 not 24.04 because of
#                        the libwebkit2gtk-4.1 ABI break)
#
# Code signing: handled via tauri.conf.json platform sections, populated
# from secrets when present. A run with empty signing secrets still
# produces unsigned binaries — useful for developer testing only.
#
# Prerequisite: icon files must exist under frontend/src-tauri/icons/.
# Run `cd frontend && npm run tauri:icon path/to/source.png` once
# locally before the first CI build, OR commit pre-built icons.

on:
  # Auto-build on EVERY push to humanovo. Each push produces a
  # published GitHub Release tagged `auto-{shortSHA}` carrying the 3
  # platform installers PLUS a `latest.json` manifest the Tauri
  # updater plugin (configured in tauri.conf.json) reads to auto-
  # upgrade installed apps in the field.
  #
  # Per user direction (2026-05-10): no path filter. The desktop app
  # bundles the backend agent layer + config, so backend-only changes
  # (new agent capabilities, new model assignments, pricing updates,
  # source registry edits) DO need a fresh installer to reach the
  # field. Trade-off: a ~30 min build on every push is the cost of
  # auto-update-on-every-change. Worth it when the alternative is
  # users running stale code against shifting backends.
  push:
    branches:
      - humanovo
    tags:
      - 'v*'
  # Manual override — release a specific tag without waiting for a
  # push, or do a dispatch-only test build.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: tag to attach the build to (leave blank for dispatch-only build, no release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # No cancellation — every commit gets its own build, run in series.
  # User feedback (May 2026): the previous `cancel-in-progress: true`
  # was killing every in-flight build the moment the next push landed,
  # so a rapid commit stream produced a long history of cancelled runs
  # and only the very latest tip ever finished. Even though the rapid-
  # push pattern is mostly a development-time artefact, the
  # cancellation noise made it ambiguous which commits had actually
  # been verified, and the user couldn't trust *any* commit's build
  # status.
  #
  # `cancel-in-progress: false` queues each new run behind the current
  # one. Slower (commits ship serially, ~3-7 min each) but every
  # commit gets a real build artifact and a clean conclusion. Tag
  # builds are unaffected because they get their own concurrency
  # group via github.ref.
  #
  # Per-SHA group so every commit gets its own queue slot. With
  # `group: native-build-${{ github.ref }}` and rapid push streams,
  # GitHub's queue manager kept only the running + latest-queued
  # runs and cancelled older queued runs before they could start —
  # producing a long history of "cancelled" middle commits with no
  # build artifact. The per-SHA group means each commit's run sits
  # in its own group of 1, so it always gets to run.
  group: native-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare-release:
    # Single point that resolves the tag/version + creates the GitHub
    # draft release. The matrix builds then upload artifacts to that
    # release via `releaseId`, eliminating the create-release race
    # where each platform's tauri-action raced past the "tag exists?"
    # check and the loser got HTTP 422 "tag_name already_exists" from
    # GitHub. The race was deterministic enough to break Linux on
    # every parallel build until this was added.
    runs-on: ubuntu-22.04
    outputs:
      tag:        ${{ steps.version.outputs.tag }}
      version:    ${{ steps.version.outputs.version }}
      mode:       ${{ steps.version.outputs.mode }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Resolve version + tag for this build
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            MODE="tag"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "humanovo" ]]; then
            SHORT="${GITHUB_SHA::8}"
            TAG="auto-${SHORT}"
            BASE="$(node -p "require('./frontend/package.json').version")"
            VERSION="${BASE}+${GITHUB_RUN_NUMBER}"
            MODE="auto"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            VERSION="${TAG#v}"
            MODE="dispatch-tag"
          else
            TAG=""
            VERSION="0.0.0-dev"
            MODE="dispatch-only"
          fi
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}"       >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=${TAG} version=${VERSION} mode=${MODE}"

      - name: Create draft release (when this build produces one)
        id: draft
        # Skip for dispatch-only builds (no tag = no release).
        # For tag / dispatch-tag / auto: create a draft release if it
        # doesn't already exist (idempotent), then capture its numeric
        # ID so each matrix build can upload artifacts to it via
        # tauri-action's `releaseId` parameter. tauri-action treats
        # releaseId as authoritative and skips its own create-release
        # step entirely, so the race that previously broke Linux can
        # no longer occur.
        #
        # Two GitHub API gotchas, both biting us before this comment:
        #   1. Draft releases don't create the underlying git tag,
        #      so GET /releases/tags/{tag} returns 404 even though
        #      the release exists. We must list /releases and filter
        #      by .tag_name to find drafts.
        #   2. `gh release create` without --target stores the draft
        #      with no commit binding. Without --target, the matrix
        #      builds that look up the release by tag would resolve
        #      to nothing once the eventual publish-release step
        #      promotes it. Pin to GITHUB_SHA so the published tag
        #      points at this commit (matches the auto-{shortSHA}
        #      convention).
        if: steps.version.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          find_id() {
            gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$TAG\") | .id] | first // empty"
          }
          # Try the lookup first — if a previous attempt already
          # created this draft (re-run, retry, etc.), reuse it.
          RELEASE_ID="$(find_id)"
          if [[ -n "$RELEASE_ID" ]]; then
            echo "Reusing existing release $TAG (id=$RELEASE_ID)."
          else
            # POST directly so we get .id from the response — calling
            # `gh release create` and then re-listing fails on the
            # ~1s eventual-consistency window on the /releases list
            # endpoint (observed empirically on 4f88bb3: created at
            # T+0, list returned empty at T+1, populated at T+5).
            # The direct-API path skips the list entirely.
            set +e
            CREATE_OUT=$(gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="humanovo ${VERSION}" \
              -f body="Build in progress — installers attach as the matrix jobs finish." \
              -F draft=true \
              --jq '.id' 2>&1)
            CREATE_RC=$?
            set -e
            if [[ "$CREATE_RC" -eq 0 ]]; then
              RELEASE_ID="$CREATE_OUT"
              echo "Created draft release $TAG (id=$RELEASE_ID)."
            else
              echo "Create returned non-zero; trying lookup with backoff."
              echo "  raw: $CREATE_OUT"
              for attempt in 1 2 3 4 5; do
                RELEASE_ID="$(find_id)"
                if [[ -n "$RELEASE_ID" ]]; then
                  echo "Found existing release id=$RELEASE_ID on attempt $attempt."
                  break
                fi
                sleep 3
              done
            fi
          fi
          if [[ -z "$RELEASE_ID" ]]; then
            echo "FATAL: release with tag $TAG not found after creation"
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Draft release ready: tag=$TAG id=$RELEASE_ID"

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # `--bundles app` deliberately skips Tauri's `dmg` target.
            # Tauri's bundle_dmg.sh (AppleScript Finder styling +
            # hdiutil attach/detach dance) is flaky on headless macOS
            # CI runners — it failed mid-bundle on 0.2.0+162 with
            # "error running bundle_dmg.sh", aborting the whole step
            # and (because publish-release needs all 3 platforms) the
            # Windows + Linux installers along with it. The `.app`
            # bundle itself builds reliably; the dedicated
            # "Build macOS DMG" step below wraps the .app in a plain,
            # deterministic hdiutil DMG with a retry loop.
            args: --target universal-apple-darwin --bundles app
            label: macos-universal
          - platform: ubuntu-22.04
            args: ''
            label: linux-x86_64
          # `windows-2025` stays the runner label. GitHub's notice
          # about a 2026-05-12 redirect to `windows-2025-vs2026`
          # refers to the *image content* being swapped to a VS-2026-
          # bundled variant — the label itself is unchanged. (Verified:
          # `windows-2025-vs2026` is not in actionlint's known label
          # set, so pinning it breaks lint. The earlier pin attempt
          # in 4e59c14 made that mistake; this comment exists so the
          # next reader doesn't repeat it.) Tauri's MSBuild path is
          # version-tolerant so the image swap is transparent to us.
          - platform: windows-2025
            args: ''
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b  # stable
        with:
          # `dtolnay/rust-toolchain` normally reads the channel from the
          # ref name (`@stable` / `@nightly` / `@1.75`). SHA-pinning makes
          # the ref a 40-char hash, so the channel inference falls
          # through to an empty string and rustup runs with no toolchain
          # name -> "invalid toolchain name ''". The `toolchain` input is
          # required whenever the ref is a SHA.
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Force ~/.cargo/bin to front of PATH + remove rustup stubs
        # Root cause of the persistent macOS "cargo metadata"
        # failure: on macOS-latest runners, the pre-installed
        # rustup-init lives at /usr/local/bin/cargo (and similarly
        # for rustup, rustc). When dtolnay/rust-toolchain installs
        # the REAL toolchain at ~/.cargo/bin/, PATH lookup still
        # hits the stub first because /usr/local/bin precedes
        # ~/.cargo/bin on the macos-latest default $PATH.
        #
        # The stub binary doesn't have `cargo metadata`, so any
        # subsequent step that shells out to `cargo` (including
        # tauri-action's child_process.spawn) bails with:
        #   error: unexpected argument 'metadata' found
        #   Usage: rustup-init[EXE] [OPTIONS]
        #
        # Fix (defense in depth):
        #   1. Write ~/.cargo/bin to $GITHUB_PATH so it lands FIRST
        #      on PATH for every subsequent step in this job.
        #   2. Delete the stub binaries at /usr/local/bin/ so PATH
        #      lookup can't find them even if ordering shifts.
        #   3. Run `rustup default stable` to commit the toolchain
        #      selection regardless of prior install state.
        #   4. Run `cargo metadata` against src-tauri's Cargo.toml
        #      so this step fails LOUD AND EARLY if the issue
        #      persists — easier to diagnose than a 30-min build
        #      that bails at the bundling stage.
        shell: bash
        run: |
          set -euo pipefail

          # 1. Put real cargo first on PATH for every subsequent step.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          # 2. Remove the runner-preinstalled rustup stubs (macOS + Linux).
          #    Windows uses a different stub path (D:\a\_temp\...);
          #    we don't touch it because the failure has only been
          #    observed on macOS so far. `case` (not `[[ ... != *-foo ]]`)
          #    keeps shellcheck happy — SC2193 fires on literal-glob
          #    comparisons inside double-bracket tests.
          PLATFORM="${{ matrix.platform }}"
          case "$PLATFORM" in
            windows-*)
              echo "Skipping stub removal on Windows runner."
              ;;
            *)
              for stub in cargo rustup rustc rustdoc; do
                if [[ -f "/usr/local/bin/$stub" ]]; then
                  file_kind="$(file "/usr/local/bin/$stub" || true)"
                  # Only remove if it's plausibly the rustup-init stub
                  # (small Mach-O / ELF that resolves to rustup-init).
                  # Keep the check loose — false positives here just mean
                  # we miss the removal; the GITHUB_PATH change still
                  # protects us.
                  if echo "$file_kind" | grep -qiE "executable|symbolic link"; then
                    echo "Removing potential rustup stub: /usr/local/bin/$stub ($file_kind)"
                    rm -f "/usr/local/bin/$stub" || true
                  fi
                fi
              done
              ;;
          esac

          # 3. Commit toolchain selection.
          rustup default stable
          rustup show

          # 4. Loud-and-early verification using EXPLICIT path so
          #    this step doesn't depend on PATH ordering itself.
          REAL_CARGO="$HOME/.cargo/bin/cargo"
          if [[ ! -x "$REAL_CARGO" ]]; then
            echo "::error::Real cargo not found at $REAL_CARGO after rustup install"
            exit 1
          fi
          "$REAL_CARGO" --version
          "$REAL_CARGO" metadata --no-deps --format-version 1 \
            --manifest-path frontend/src-tauri/Cargo.toml > /dev/null
          echo "[ok] cargo verification passed: $REAL_CARGO"

      - name: Export CARGO env var for tauri-action (non-Windows)
        # Belt-and-suspenders for the macOS PATH-stub issue: set
        # CARGO + RUSTC explicitly so any child process tauri-action
        # spawns uses the absolute path. @tauri-apps/cli reads $CARGO
        # when set.
        #
        # SKIP on Windows: the bash $HOME path (`/c/Users/...`) gets
        # interpreted by Cargo as Windows-relative, composing a bogus
        # `D:/c/Users/...` that doesn't exist. Windows doesn't have
        # the macOS PATH-stub issue (different stub location), so the
        # env var isn't needed there.
        if: matrix.platform != 'windows-2025'
        shell: bash
        run: |
          echo "CARGO=$HOME/.cargo/bin/cargo" >> "$GITHUB_ENV"
          echo "RUSTC=$HOME/.cargo/bin/rustc" >> "$GITHUB_ENV"

      - name: Cache Rust deps
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # libappindicator3-dev was REMOVED from Ubuntu 22.04 — apt-get
          # would exit 100 on it. The Ayatana fork (libayatana-appindicator3-dev)
          # is the supported replacement and is what Tauri 2 looks for.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: Generate placeholder icons if missing
        shell: bash
        run: |
          # Tauri's bundler refuses to build without these files. We
          # generate a placeholder from scripts/generate_placeholder_icon.py
          # (pure-stdlib PNG generator, no Pillow / ImageMagick needed)
          # so the build always succeeds out of the box. Replace
          # frontend/src-tauri/icons/* with branded assets later via:
          #   cd frontend && npm run tauri:icon path/to/source-1024.png
          mkdir -p frontend/src-tauri/icons
          if [ ! -f frontend/src-tauri/icons/icon.png ]; then
            python3 scripts/generate_placeholder_icon.py \
              frontend/src-tauri/icons/icon.png
          fi
          # Tauri CLI fans the source PNG out into all platform sizes
          # (32x32, 128x128, 128x128@2x, icon.icns, icon.ico). Idempotent
          # — if the targets already exist they're regenerated.
          cd frontend
          npx --yes -p @tauri-apps/cli@2 tauri icon \
            src-tauri/icons/icon.png \
            --output src-tauri/icons

      - name: Re-export version from prepare-release into step outputs
        id: version
        # Shim. The single source of truth for tag/version/mode/release_id
        # is the prepare-release job (one resolution → all 3 matrix
        # platforms agree). This step just re-exports those values as
        # this job's `steps.version.outputs.*` so the rest of the workflow
        # (tauri-action `with:`, the stable-name-alias uploader, the
        # job-summary printer) reads them unchanged.
        shell: bash
        run: |
          echo "tag=${{ needs.prepare-release.outputs.tag }}"             >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.prepare-release.outputs.version }}"     >> "$GITHUB_OUTPUT"
          echo "mode=${{ needs.prepare-release.outputs.mode }}"           >> "$GITHUB_OUTPUT"
          echo "release_id=${{ needs.prepare-release.outputs.release_id }}" >> "$GITHUB_OUTPUT"

      - name: Sync resolved version into tauri.conf.json
        shell: bash
        run: |
          # The `version` in tauri.conf.json is what the updater plugin
          # compares against `latest.json.version` to decide whether to
          # offer an upgrade. Patching it in CI (rather than checking
          # in a constantly-bumping value) keeps the repo clean.
          python3 scripts/set_tauri_version.py "${{ steps.version.outputs.version }}"

      - name: Conditionally enable Tauri updater (when signing keys present)
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          # Updater is disabled in the committed tauri.conf.json so the
          # very first build (with no signing keys configured) succeeds.
          # When the operator generates a Tauri updater keypair and
          # uploads BOTH halves to repo Secrets:
          #   TAURI_SIGNING_PRIVATE_KEY  (consumed by tauri-action env)
          #   TAURI_SIGNING_PUBLIC_KEY   (embedded in the binary so it
          #                                can verify .sig files)
          # …this step injects the updater plugin block + flips
          # createUpdaterArtifacts = true. No code change needed.
          python3 scripts/configure_tauri_updater.py

      - name: Forward signing secrets to env (only when actually set)
        # tauri-action treats any APPLE_CERTIFICATE / TAURI_SIGNING_*
        # env var as a request to sign — even if it's an empty string,
        # which makes `security import` exit 1 with "One or more
        # parameters passed to a function were not valid". GitHub
        # Actions doesn't support per-key conditional env blocks, so
        # we forward each var to GITHUB_ENV only when its source secret
        # is non-empty. Result: a no-secrets repo produces unsigned
        # installers cleanly; a fully-configured repo signs everything.
        shell: bash
        env:
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          _TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          _TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          forward() {
            local name="$1"
            local val="$2"
            if [ -n "$val" ]; then
              # Use the file syntax to avoid log-leaking the secret.
              {
                echo "${name}<<__END__"
                echo "$val"
                echo "__END__"
              } >> "$GITHUB_ENV"
              echo "forwarded: $name (set, $(printf %s "$val" | wc -c) bytes)"
            else
              echo "skipped:   $name (secret unset)"
            fi
          }
          forward APPLE_CERTIFICATE                   "$_APPLE_CERTIFICATE"
          forward APPLE_CERTIFICATE_PASSWORD          "$_APPLE_CERTIFICATE_PASSWORD"
          forward APPLE_SIGNING_IDENTITY              "$_APPLE_SIGNING_IDENTITY"
          forward APPLE_ID                            "$_APPLE_ID"
          forward APPLE_PASSWORD                      "$_APPLE_PASSWORD"
          forward APPLE_TEAM_ID                       "$_APPLE_TEAM_ID"
          forward TAURI_SIGNING_PRIVATE_KEY           "$_TAURI_SIGNING_PRIVATE_KEY"
          forward TAURI_SIGNING_PRIVATE_KEY_PASSWORD  "$_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Build native app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # action-v0.6.2
        env:
          # Token resolution prefers a user-supplied PAT (RELEASE_PAT)
          # over the workflow-issued GITHUB_TOKEN. Why: when the repo's
          # "Settings → Actions → General → Workflow permissions" is
          # set to "Read repository contents and packages" (the default
          # for some org / Pro setups), GITHUB_TOKEN gets a 403
          # "Resource not accessible by integration" at the
          # create-release step even when the workflow declares
          # `permissions: contents: write`. A classic PAT with
          # `repo` scope bypasses that org-level toggle.
          #
          # Operator action when the build fails on create-release:
          #   1. Open https://github.com/satvikOS/humanovo/settings/actions
          #      and switch Workflow permissions to "Read and write".
          #   2. OR create a fine-grained PAT (Settings → Developer
          #      settings → Personal access tokens) with `Contents:
          #      Read and write` scope on the humanovo repo, store as
          #      repo secret RELEASE_PAT.
          # Either fix unblocks the build; the PAT path is preferable
          # because it survives org-level Workflow-permission resets.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          # Backend URL the installed app calls. Read from the repo
          # variable API_BASE_URL (Settings → Secrets and variables →
          # Actions → Variables). Empty until the AWS backend bootstrap
          # finishes — at which point set API_BASE_URL to the API
          # Gateway URL (e.g. https://xxxx.execute-api.us-east-1.amazonaws.com
          # or https://api.humanovo.net once the custom domain is
          # wired). While empty, services/api.ts falls back to a
          # relative '/api/v1' base — which has no server in the Tauri
          # shell, so the app shows empty data. Setting this variable
          # + one rebuild is the single step that connects the
          # installed app to the live backend.
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          # Mock auth is OFF: the real JWT auth backend is live
          # (app/core/auth.py — register / login / me all serving on
          # the API Gateway URL above). With mock auth the app issued a
          # fake client-side token that the real backend rejects with
          # 401, so every data call failed and the app looked like the
          # backend was unreachable. Shipping with real auth: users
          # sign up / log in in-app and get a real JWT.
          VITE_ENABLE_MOCK_AUTH: 'false'
          # Code-signing + Tauri-updater secrets are forwarded to env
          # by the previous step ONLY when the corresponding repo secret
          # is non-empty. Empty-secret repos produce unsigned installers
          # without tripping `security import` / signer errors.
        with:
          projectPath: frontend
          # releaseId pins the upload to the draft release that
          # prepare-release created. tauri-action treats releaseId as
          # authoritative and skips its own create-release step, which
          # is what avoids the parallel-matrix race (HTTP 422
          # "tag_name already_exists") that previously broke Linux on
          # every push. tagName + releaseName + releaseBody are still
          # set so dispatch-only builds (where releaseId is empty)
          # behave the same as before.
          releaseId: ${{ steps.version.outputs.release_id }}
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: humanovo ${{ steps.version.outputs.version }}
          releaseBody: |
            humanovo ${{ steps.version.outputs.version }} — auto-built from `${{ github.sha }}`.

            **Pick the installer for your OS:**

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon + Intel) | `humanovo-macos-universal.dmg` |
            | Windows 10/11 | `humanovo-windows-x64.exe` (NSIS, recommended) or `humanovo-windows-x64.msi` |
            | Linux .deb (Ubuntu / Debian) | `humanovo-linux-x64.deb` |
            | Linux AppImage (any distro) | `humanovo-linux-x64.AppImage` |

            All filenames are stable across releases — `releases/latest/download/<name>` always points at the newest build.

            Already installed? The Tauri auto-updater picks this up on next launch.
          # The release is always created as a draft by prepare-release.
          # The publish-release tail job flips it to published for auto
          # builds once all 3 matrix jobs have attached their artifacts.
          # Tag / dispatch-tag builds intentionally stay draft so a
          # human reviews before shipping.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build macOS DMG (plain hdiutil, retried)
        # Replaces Tauri's flaky bundle_dmg.sh. The .app was built by
        # the step above (--bundles app). Here we wrap it in a simple
        # compressed DMG using only `hdiutil create` — no AppleScript,
        # no window-styling, no attach/detach race. The result is a
        # functional drag-to-Applications DMG; it just lacks a custom
        # background image, which no user has ever missed.
        #
        # hdiutil can still transiently fail on CI ("Resource busy",
        # "Device not configured"), so we retry up to 3×. The DMG
        # lands in the bundle/dmg/ dir where the stable-name-alias
        # step below already globs for *.dmg.
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="frontend/src-tauri/target/universal-apple-darwin/release/bundle"
          APP_PATH="$BUNDLE_ROOT/macos/humanovo.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "FATAL: expected .app not found at $APP_PATH"
            ls -la "$BUNDLE_ROOT/macos" || true
            exit 1
          fi
          DMG_DIR="$BUNDLE_ROOT/dmg"
          mkdir -p "$DMG_DIR"
          DMG_PATH="$DMG_DIR/humanovo_${VERSION}_universal.dmg"
          # Stage the .app + an /Applications symlink so the DMG opens
          # as the familiar drag-to-install layout.
          STAGE="$(mktemp -d)/humanovo"
          mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          ok=
          for attempt in 1 2 3; do
            rm -f "$DMG_PATH"
            if hdiutil create \
                 -volname "humanovo" \
                 -srcfolder "$STAGE" \
                 -fs HFS+ \
                 -format UDZO \
                 -ov \
                 "$DMG_PATH"; then
              ok=1
              echo "DMG created on attempt $attempt: $DMG_PATH"
              break
            fi
            echo "hdiutil create failed (attempt $attempt) — retrying in 5s."
            sleep 5
          done
          if [[ -z "$ok" ]]; then
            echo "FATAL: hdiutil create failed after 3 attempts."
            exit 1
          fi
          # Upload the versioned DMG to the draft release so it sits
          # alongside the other platforms' installers. The stable-name
          # alias step below additionally publishes humanovo-macos-
          # universal.dmg.
          gh release upload "${{ steps.version.outputs.tag }}" "$DMG_PATH" \
            --repo "$GITHUB_REPOSITORY" --clobber || \
            echo "WARN: versioned-DMG upload failed; alias step will still publish the stable name."

      - name: Attach stable-name aliases to release
        # Tauri's bundler emits files like humanovo_0.2.0+7_universal.dmg
        # — version embedded. End users want a stable URL like
        # `releases/latest/download/humanovo-macos-universal.dmg` that
        # doesn't change per release. We re-upload each artifact under
        # a clean OS-arch.format name. Both names point at the same
        # bytes; the landing page (humanovo.net/download/<os>) 302s to
        # the stable name.
        # dispatch builds skip this (those have explicit versioned URLs).
        if: steps.version.outputs.mode == 'auto'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BUNDLE_DIR=frontend/src-tauri/target/release/bundle
          # Glob → clean stable name. One source artifact per glob,
          # uniform `humanovo-<os>-<arch>.<ext>` naming throughout.
          declare -A aliases=(
            ["*.dmg"]="humanovo-macos-universal.dmg"
            ["*-setup.exe"]="humanovo-windows-x64.exe"
            ["*.msi"]="humanovo-windows-x64.msi"
            ["*.deb"]="humanovo-linux-x64.deb"
            ["*.AppImage"]="humanovo-linux-x64.AppImage"
          )
          for glob in "${!aliases[@]}"; do
            for src in $(find "$BUNDLE_DIR" -type f -name "$glob" 2>/dev/null); do
              alias_name="${aliases[$glob]}"
              cp "$src" "/tmp/$alias_name"
              echo "Uploading alias: $alias_name (from $src)"
              gh release upload "$TAG" "/tmp/$alias_name" \
                --repo "$GITHUB_REPOSITORY" --clobber
            done
          done

      - name: Upload artifacts (dispatch-only fallback)
        if: steps.version.outputs.mode == 'dispatch-only'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: humanovo-${{ matrix.label }}
          path: |
            frontend/src-tauri/target/release/bundle/**/*.dmg
            frontend/src-tauri/target/release/bundle/**/*.msi
            frontend/src-tauri/target/release/bundle/**/*.exe
            frontend/src-tauri/target/release/bundle/**/*.deb
            frontend/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
          retention-days: 14

      - name: Print results to job summary
        shell: bash
        run: |
          MODE="${{ steps.version.outputs.mode }}"
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## humanovo native build — ${{ matrix.label }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Platform | \`${{ matrix.platform }}\` |"
            echo "| Build args | \`${{ matrix.args }}\` |"
            echo "| Mode | \`${MODE}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Tag | \`${TAG:-none}\` |"
            echo ""
            case "${MODE}" in
              auto)
                echo "**Published release:** [Releases ▸ ${TAG}](../../releases/tag/${TAG})"
                echo ""
                echo "Already-installed apps will auto-upgrade on next launch via the Tauri updater plugin."
                ;;
              tag|dispatch-tag)
                echo "Draft release \`${TAG}\` — review + publish in the Releases tab to roll out to installed apps."
                ;;
              dispatch-only)
                echo "Dispatch-only test build. Artifacts under \`humanovo-${{ matrix.label }}\` for 14 days; no release created."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    # Flips the draft release prepare-release created to published, but
    # only for `auto` builds (push to humanovo) and only when ALL 3
    # matrix platforms succeeded. Tag / dispatch-tag builds stay draft
    # so a human can review before shipping. If any matrix job failed
    # we keep the release as a draft too — the operator inspects the
    # partial artifacts and decides whether to publish anyway or kick
    # off a rebuild.
    needs: [prepare-release, build]
    if: |
      always() &&
      needs.prepare-release.outputs.mode == 'auto' &&
      needs.prepare-release.outputs.tag != '' &&
      needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Un-draft the release
        # Using PATCH on /releases/{id} (rather than `gh release edit
        # <tag>`) because draft releases have no git tag yet — gh
        # release edit's tag lookup hits the same 404 path that
        # broke prepare-release. We already captured the numeric
        # release_id, so PATCH by id is direct and unambiguous.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false > /dev/null
          echo "Published release $TAG (id=$RELEASE_ID)."
