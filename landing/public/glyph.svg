<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <!--
    humanovo glyph mark.

    Composition:
      - Outer circle = the Vitruvian frame: the body of knowledge as a
        bounded, knowable object. Stroke matches body ink (#1A1613).
      - Inscribed "h" = the wordmark's initial, drawn as a Renaissance
        scholarly initial (vertical stem with a rounded shoulder
        completing the bowl). Same ink weight as the circle so the
        glyph reads as a single mark, not a logo + text composition.
      - Rust dot at the foot of the stem = the brand's signature
        accent: the moment of inquiry, the ink's first impact on
        paper. Always #B44A2C; never substituted.

    Sized for nav favicon and inline use; works at 16-px favicons up
    through 256-px hero placements without retouching. Works in dark
    mode by inverting `currentColor` on the strokes (use class
    `glyph-on-dark`).
  -->
  <circle cx="16" cy="16" r="14"
          stroke="currentColor" stroke-width="1.4"
          opacity="0.85"/>
  <!-- "h" stem -->
  <path d="M11 7.5 L11 24"
        stroke="currentColor" stroke-width="2"
        stroke-linecap="round"/>
  <!-- "h" shoulder + descender (rounded arc forming the bowl) -->
  <path d="M11 16 Q11 12.5 14 12.5 L17 12.5 Q21 12.5 21 16.5 L21 24"
        stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>
  <!-- Rust accent: ink drying at the foot of the stem -->
  <circle cx="11" cy="24" r="1.6" fill="#B44A2C"/>
</svg>
