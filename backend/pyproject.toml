[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genup-backend"
version = "0.1.0"
description = "GenUp Biomedical Discovery Platform - Backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Function call in default argument (FastAPI Depends pattern)
    "B007",   # Loop control variable not used (acceptable for readability)
    "B904",   # Exception chaining (style preference)
    "B905",   # zip without strict (not always necessary)
    "C401",   # Unnecessary generator (minor optimization)
    "C414",   # Unnecessary list call within sorted (minor)
    "C416",   # Unnecessary list comprehension (minor)
    "N805",   # First argument naming (validators use cls)
    "N806",   # Variable in function should be lowercase (SIR model uses S, I, R)
    "E741",   # Ambiguous variable name (I is standard in epidemiology)
    "F841",   # Local variable assigned but never used (will clean up incrementally)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
