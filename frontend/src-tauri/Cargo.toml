[package]
name = "humanovo"
version = "0.2.0"
description = "humanovo — AI-native biomedical hypothesis platform"
authors = ["humanovo"]
edition = "2021"
rust-version = "1.77.2"

# We split into a binary entrypoint (`src/main.rs`) and a library
# (`src/lib.rs`) so the same setup can be reused by mobile targets
# (iOS / Android) which require a library crate. Desktop-only code
# can stay in main.rs without disrupting the cargo-mobile flow.
[lib]
name = "humanovo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
# Window-state persistence — remembers size/position/maximized across
# launches so the user doesn't have to re-resize humanovo every time
# they reopen it. Wired up in lib.rs.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Single-instance: prevents the user from launching two copies of
# humanovo from the dock. Required for deep-link handling — the second
# instance forwards its launch URL to the first one and exits.
[target."cfg(any(target_os = \"macos\", target_os = \"windows\", target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"   # smaller binaries; native panics terminate cleanly
codegen-units = 1 # better optimization at the cost of build time
lto = true        # link-time optimization
opt-level = "s"   # optimize for size (3-5MB smaller than -O3 for our app)
strip = true      # strip debug symbols
