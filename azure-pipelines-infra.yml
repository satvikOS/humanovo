# Azure Pipelines equivalent of .github/workflows/deploy-infra.yml
# Deploys infrastructure (Terraform) + Lambda backend
trigger:
  branches:
    include:
      - main
      - humanovo
      - claude/*
  paths:
    include:
      - infrastructure/**
      - backend/**
      - azure-pipelines-infra.yml

pool:
  vmImage: 'ubuntu-latest'

variables:
  AWS_REGION: 'us-east-1'
  TERRAFORM_VERSION: '1.5.7'
  TF_STATE_BUCKET: 'genup-terraform-state'
  TF_LOCK_TABLE: 'genup-terraform-locks'
  ENVIRONMENT: 'dev'

stages:
  - stage: DeployInfra
    displayName: 'Deploy Infrastructure & Backend'
    jobs:
      - job: Deploy
        displayName: 'Terraform + Lambda Deploy'
        timeoutInMinutes: 30
        steps:
          - checkout: self

          # --- Terraform State Bootstrap ---
          - task: AWSShellScript@1
            displayName: 'Setup Terraform State Infrastructure'
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                if ! aws s3api head-bucket --bucket "$(TF_STATE_BUCKET)" 2>/dev/null; then
                  echo "Creating Terraform state bucket: $(TF_STATE_BUCKET)"
                  aws s3api create-bucket --bucket "$(TF_STATE_BUCKET)" --region "$(AWS_REGION)"
                  aws s3api put-bucket-versioning --bucket "$(TF_STATE_BUCKET)" \
                    --versioning-configuration Status=Enabled
                  aws s3api put-bucket-encryption --bucket "$(TF_STATE_BUCKET)" \
                    --server-side-encryption-configuration '{
                      "Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]
                    }'
                  aws s3api put-public-access-block --bucket "$(TF_STATE_BUCKET)" \
                    --public-access-block-configuration '{
                      "BlockPublicAcls": true, "IgnorePublicAcls": true,
                      "BlockPublicPolicy": true, "RestrictPublicBuckets": true
                    }'
                fi

                if ! aws dynamodb describe-table --table-name "$(TF_LOCK_TABLE)" 2>/dev/null; then
                  echo "Creating Terraform lock table: $(TF_LOCK_TABLE)"
                  aws dynamodb create-table \
                    --table-name "$(TF_LOCK_TABLE)" \
                    --attribute-definitions AttributeName=LockID,AttributeType=S \
                    --key-schema AttributeName=LockID,KeyType=HASH \
                    --billing-mode PAY_PER_REQUEST
                  aws dynamodb wait table-exists --table-name "$(TF_LOCK_TABLE)"
                fi
                echo "Terraform state infrastructure ready"

          # --- Terraform ---
          - task: TerraformInstaller@1
            displayName: 'Install Terraform $(TERRAFORM_VERSION)'
            inputs:
              terraformVersion: '$(TERRAFORM_VERSION)'

          - task: AWSShellScript@1
            displayName: 'Terraform Init'
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                cd $(Build.SourcesDirectory)/infrastructure/terraform
                terraform init \
                  -backend-config="bucket=$(TF_STATE_BUCKET)" \
                  -backend-config="key=infrastructure/terraform.tfstate" \
                  -backend-config="region=$(AWS_REGION)" \
                  -backend-config="dynamodb_table=$(TF_LOCK_TABLE)" \
                  -backend-config="encrypt=true"
            env:
              TF_VAR_azure_ai_endpoint: $(AZURE_AI_ENDPOINT)
              TF_VAR_azure_ai_key: $(AZURE_AI_KEY)
              TF_VAR_azure_deepseek_endpoint: $(AZURE_DEEPSEEK_ENDPOINT)
              TF_VAR_azure_deepseek_key: $(AZURE_DEEPSEEK_KEY)
              TF_VAR_azure_mistral_endpoint: $(AZURE_MISTRAL_ENDPOINT)
              TF_VAR_azure_mistral_key: $(AZURE_MISTRAL_KEY)
              TF_VAR_azure_gpt4o_endpoint: $(AZURE_GPT4O_ENDPOINT)
              TF_VAR_azure_gpt4o_key: $(AZURE_GPT4O_KEY)
              TF_VAR_azure_cohere_endpoint: $(AZURE_COHERE_ENDPOINT)
              TF_VAR_azure_cohere_key: $(AZURE_COHERE_KEY)
              TF_VAR_azure_kimi_endpoint: $(AZURE_KIMI_ENDPOINT)
              TF_VAR_azure_kimi_key: $(AZURE_KIMI_KEY)
              TF_VAR_azure_o3mini_endpoint: $(AZURE_O3MINI_ENDPOINT)
              TF_VAR_azure_o3mini_key: $(AZURE_O3MINI_KEY)
              TF_VAR_azure_gpt41_endpoint: $(AZURE_GPT41_ENDPOINT)
              TF_VAR_azure_gpt41_key: $(AZURE_GPT41_KEY)
              TF_VAR_azure_phi4_endpoint: $(AZURE_PHI4_ENDPOINT)
              TF_VAR_azure_phi4_key: $(AZURE_PHI4_KEY)
              TF_VAR_azure_grok_endpoint: $(AZURE_GROK_ENDPOINT)
              TF_VAR_azure_grok_key: $(AZURE_GROK_KEY)
              TF_VAR_azure_embedding_endpoint: $(AZURE_EMBEDDING_ENDPOINT)
              TF_VAR_azure_embedding_key: $(AZURE_EMBEDDING_KEY)

          - task: AWSShellScript@1
            displayName: 'Force Unlock Stale Terraform State Lock'
            continueOnError: true
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                cd $(Build.SourcesDirectory)/infrastructure/terraform
                LOCK_ITEM=$(aws dynamodb get-item \
                  --table-name "$(TF_LOCK_TABLE)" \
                  --key '{"LockID": {"S": "genup-terraform-state/infrastructure/terraform.tfstate"}}' \
                  --output json 2>/dev/null || echo '{}')

                LOCK_ID=$(echo "$LOCK_ITEM" | python3 -c "
                import json, sys
                try:
                    item = json.load(sys.stdin)
                    info = json.loads(item.get('Item', {}).get('Info', {}).get('S', '{}'))
                    print(info.get('ID', ''))
                except Exception:
                    print('')
                " 2>/dev/null)

                if [ -n "$LOCK_ID" ]; then
                  echo "Found stale lock: $LOCK_ID — force-unlocking..."
                  terraform force-unlock -force "$LOCK_ID" || true
                else
                  echo "No stale lock found"
                fi

          - task: AWSShellScript@1
            displayName: 'Terraform Plan & Apply - S3 First'
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                cd $(Build.SourcesDirectory)/infrastructure/terraform
                terraform plan -var-file=environments/dev.tfvars -target=module.s3 -out=tfplan-s3 -input=false
                terraform apply -auto-approve tfplan-s3

                GENUP_BUCKET=$(terraform output -raw bucket_name 2>/dev/null || echo "genup-$(ENVIRONMENT)")
                echo "##vso[task.setvariable variable=GENUP_BUCKET]$GENUP_BUCKET"
                echo "Unified bucket: $GENUP_BUCKET"
            env:
              TF_VAR_azure_ai_endpoint: $(AZURE_AI_ENDPOINT)
              TF_VAR_azure_ai_key: $(AZURE_AI_KEY)
              TF_VAR_azure_deepseek_endpoint: $(AZURE_DEEPSEEK_ENDPOINT)
              TF_VAR_azure_deepseek_key: $(AZURE_DEEPSEEK_KEY)
              TF_VAR_azure_mistral_endpoint: $(AZURE_MISTRAL_ENDPOINT)
              TF_VAR_azure_mistral_key: $(AZURE_MISTRAL_KEY)
              TF_VAR_azure_gpt4o_endpoint: $(AZURE_GPT4O_ENDPOINT)
              TF_VAR_azure_gpt4o_key: $(AZURE_GPT4O_KEY)
              TF_VAR_azure_cohere_endpoint: $(AZURE_COHERE_ENDPOINT)
              TF_VAR_azure_cohere_key: $(AZURE_COHERE_KEY)
              TF_VAR_azure_kimi_endpoint: $(AZURE_KIMI_ENDPOINT)
              TF_VAR_azure_kimi_key: $(AZURE_KIMI_KEY)
              TF_VAR_azure_o3mini_endpoint: $(AZURE_O3MINI_ENDPOINT)
              TF_VAR_azure_o3mini_key: $(AZURE_O3MINI_KEY)
              TF_VAR_azure_gpt41_endpoint: $(AZURE_GPT41_ENDPOINT)
              TF_VAR_azure_gpt41_key: $(AZURE_GPT41_KEY)
              TF_VAR_azure_phi4_endpoint: $(AZURE_PHI4_ENDPOINT)
              TF_VAR_azure_phi4_key: $(AZURE_PHI4_KEY)
              TF_VAR_azure_grok_endpoint: $(AZURE_GROK_ENDPOINT)
              TF_VAR_azure_grok_key: $(AZURE_GROK_KEY)
              TF_VAR_azure_embedding_endpoint: $(AZURE_EMBEDDING_ENDPOINT)
              TF_VAR_azure_embedding_key: $(AZURE_EMBEDDING_KEY)

          - task: AWSShellScript@1
            displayName: 'Package & Upload Lambda Code'
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                GENUP_BUCKET="$(GENUP_BUCKET)"

                # --- Lambda Layers ---
                mkdir -p /tmp/lambda-layer/python
                pip install "aws-lambda-powertools>=3.0,<4.0" "openai>=1.12.0,<2.0" -t /tmp/lambda-layer/python/ --quiet
                cd /tmp/lambda-layer && zip -r ../dependencies-layer.zip python/ -x '*.pyc' '*__pycache__*'

                mkdir -p /tmp/scipy-layer/python
                echo "# scipy placeholder" > /tmp/scipy-layer/python/__init__.py
                cd /tmp/scipy-layer && zip -r ../scipy-layer.zip python/

                aws s3 cp /tmp/dependencies-layer.zip "s3://$GENUP_BUCKET/artifacts/lambda-layers/dependencies.zip"
                aws s3 cp /tmp/scipy-layer.zip "s3://$GENUP_BUCKET/artifacts/lambda-layers/scipy.zip"

                # --- Lambda Functions ---
                HANDLERS_DIR="$(Build.SourcesDirectory)/backend/lambda/handlers"

                declare -A HANDLER_FILES=(
                  ["api_core"]="api_core.py"
                  ["projects"]="projects.py"
                  ["hypotheses"]="hypotheses.py"
                  ["evidence"]="evidence.py"
                  ["knowledge"]="knowledge.py"
                  ["hypothesis_generation"]="hypothesis_generation.py"
                  ["agent_orchestrator"]="agent_orchestrator.py"
                  ["search_agent"]="search_agent.py"
                  ["embeddings"]="embeddings.py"
                  ["simulation"]="simulation.py"
                  ["pubmed_fetcher"]="pubmed_fetcher.py"
                  ["clinical_trials_fetcher"]="clinical_trials_fetcher.py"
                  ["brave_search_fetcher"]="brave_search_fetcher.py"
                  ["embeddings_generator"]="embeddings_generator.py"
                  ["rag_retrieval"]="rag_retrieval.py"
                  ["ingestion_scheduler"]="ingestion_scheduler.py"
                )

                PLACEHOLDER_FUNCTIONS="simulation_worker ingestion"

                for fn in "${!HANDLER_FILES[@]}"; do
                  handler_file="${HANDLER_FILES[$fn]}"
                  if [ -f "$HANDLERS_DIR/$handler_file" ]; then
                    mkdir -p /tmp/fn-$fn/handlers
                    cp "$HANDLERS_DIR/$handler_file" "/tmp/fn-$fn/handlers/$handler_file"
                    touch "/tmp/fn-$fn/handlers/__init__.py"
                    if [ "$fn" = "agent_orchestrator" ]; then
                      pip install "openai>=1.12.0,<2.0" "reportlab>=4.0,<5.0" -t "/tmp/fn-$fn/" --quiet 2>/dev/null
                    fi
                    cd "/tmp/fn-$fn" && zip -r "/tmp/$fn.zip" . -x '*.pyc' '*__pycache__*'
                    aws s3 cp "/tmp/$fn.zip" "s3://$GENUP_BUCKET/artifacts/lambda-functions/$fn.zip"
                  else
                    aws s3 cp /tmp/scipy-layer.zip "s3://$GENUP_BUCKET/artifacts/lambda-functions/$fn.zip"
                  fi
                done

                for fn in $PLACEHOLDER_FUNCTIONS; do
                  mkdir -p /tmp/fn-$fn/handlers
                  cat > "/tmp/fn-$fn/handlers/${fn}.py" << 'PYEOF'
                import json
                def handler(event, context):
                    return {'statusCode': 200, 'body': json.dumps({'status': 'ok'})}
                PYEOF
                  touch "/tmp/fn-$fn/handlers/__init__.py"
                  cd "/tmp/fn-$fn" && zip -r "/tmp/$fn.zip" handlers/
                  aws s3 cp "/tmp/$fn.zip" "s3://$GENUP_BUCKET/artifacts/lambda-functions/$fn.zip"
                done
                echo "Lambda code packaged and uploaded"

          - task: AWSShellScript@1
            displayName: 'Terraform Plan & Apply - Full'
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                cd $(Build.SourcesDirectory)/infrastructure/terraform
                terraform plan -var-file=environments/dev.tfvars -out=tfplan -input=false
                terraform apply -auto-approve tfplan
            env:
              TF_VAR_azure_ai_endpoint: $(AZURE_AI_ENDPOINT)
              TF_VAR_azure_ai_key: $(AZURE_AI_KEY)
              TF_VAR_azure_deepseek_endpoint: $(AZURE_DEEPSEEK_ENDPOINT)
              TF_VAR_azure_deepseek_key: $(AZURE_DEEPSEEK_KEY)
              TF_VAR_azure_mistral_endpoint: $(AZURE_MISTRAL_ENDPOINT)
              TF_VAR_azure_mistral_key: $(AZURE_MISTRAL_KEY)
              TF_VAR_azure_gpt4o_endpoint: $(AZURE_GPT4O_ENDPOINT)
              TF_VAR_azure_gpt4o_key: $(AZURE_GPT4O_KEY)
              TF_VAR_azure_cohere_endpoint: $(AZURE_COHERE_ENDPOINT)
              TF_VAR_azure_cohere_key: $(AZURE_COHERE_KEY)
              TF_VAR_azure_kimi_endpoint: $(AZURE_KIMI_ENDPOINT)
              TF_VAR_azure_kimi_key: $(AZURE_KIMI_KEY)
              TF_VAR_azure_o3mini_endpoint: $(AZURE_O3MINI_ENDPOINT)
              TF_VAR_azure_o3mini_key: $(AZURE_O3MINI_KEY)
              TF_VAR_azure_gpt41_endpoint: $(AZURE_GPT41_ENDPOINT)
              TF_VAR_azure_gpt41_key: $(AZURE_GPT41_KEY)
              TF_VAR_azure_phi4_endpoint: $(AZURE_PHI4_ENDPOINT)
              TF_VAR_azure_phi4_key: $(AZURE_PHI4_KEY)
              TF_VAR_azure_grok_endpoint: $(AZURE_GROK_ENDPOINT)
              TF_VAR_azure_grok_key: $(AZURE_GROK_KEY)
              TF_VAR_azure_embedding_endpoint: $(AZURE_EMBEDDING_ENDPOINT)
              TF_VAR_azure_embedding_key: $(AZURE_EMBEDDING_KEY)

          - task: AWSShellScript@1
            displayName: 'Deploy Lambda Function Code'
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                GENUP_BUCKET="$(GENUP_BUCKET)"
                NAME_PREFIX="genup-$(ENVIRONMENT)"

                ALL_FUNCTIONS="api_core projects hypotheses evidence knowledge hypothesis_generation agent_orchestrator search_agent embeddings simulation simulation_worker ingestion pubmed_fetcher clinical_trials_fetcher brave_search_fetcher embeddings_generator rag_retrieval ingestion_scheduler"

                for fn in $ALL_FUNCTIONS; do
                  echo "  Updating ${NAME_PREFIX}-${fn}..."
                  aws lambda update-function-code \
                    --function-name "${NAME_PREFIX}-${fn}" \
                    --s3-bucket "$GENUP_BUCKET" \
                    --s3-key "artifacts/lambda-functions/${fn}.zip" \
                    --no-cli-pager 2>/dev/null || echo "  WARNING: Failed to update ${fn}"
                done

                sleep 10

                for fn in api_core projects agent_orchestrator; do
                  aws lambda get-function --function-name "${NAME_PREFIX}-${fn}" \
                    --query 'Configuration.{State:State,LastModified:LastModified}' \
                    --no-cli-pager 2>/dev/null || true
                done

          - task: AWSShellScript@1
            displayName: 'Update Agent Orchestrator Azure AI Env Vars'
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                NAME_PREFIX="genup-$(ENVIRONMENT)"
                FN_NAME="${NAME_PREFIX}-agent_orchestrator"

                CURRENT_ENV=$(aws lambda get-function-configuration \
                  --function-name "$FN_NAME" \
                  --query 'Environment.Variables' \
                  --output json 2>/dev/null || echo '{}')

                UPDATED_ENV=$(echo "$CURRENT_ENV" | python3 -c "
                import json, sys, os
                env = json.load(sys.stdin)
                for key in [
                  'AZURE_AI_ENDPOINT', 'AZURE_AI_KEY',
                  'AZURE_DEEPSEEK_ENDPOINT', 'AZURE_DEEPSEEK_KEY',
                  'AZURE_MISTRAL_ENDPOINT', 'AZURE_MISTRAL_KEY',
                  'AZURE_GPT4O_ENDPOINT', 'AZURE_GPT4O_KEY',
                  'AZURE_COHERE_ENDPOINT', 'AZURE_COHERE_KEY',
                  'AZURE_KIMI_ENDPOINT', 'AZURE_KIMI_KEY',
                  'AZURE_O3MINI_ENDPOINT', 'AZURE_O3MINI_KEY',
                  'AZURE_GPT41_ENDPOINT', 'AZURE_GPT41_KEY',
                  'AZURE_PHI4_ENDPOINT', 'AZURE_PHI4_KEY',
                  'AZURE_GROK_ENDPOINT', 'AZURE_GROK_KEY',
                ]:
                    env[key] = os.environ.get(key, '')
                print(json.dumps({'Variables': env}))
                ")

                aws lambda update-function-configuration \
                  --function-name "$FN_NAME" \
                  --environment "$UPDATED_ENV" \
                  --no-cli-pager 2>/dev/null

                aws lambda wait function-updated --function-name "$FN_NAME" 2>/dev/null || true
                echo "Azure AI env vars updated"
            env:
              AZURE_AI_ENDPOINT: $(AZURE_AI_ENDPOINT)
              AZURE_AI_KEY: $(AZURE_AI_KEY)
              AZURE_DEEPSEEK_ENDPOINT: $(AZURE_DEEPSEEK_ENDPOINT)
              AZURE_DEEPSEEK_KEY: $(AZURE_DEEPSEEK_KEY)
              AZURE_MISTRAL_ENDPOINT: $(AZURE_MISTRAL_ENDPOINT)
              AZURE_MISTRAL_KEY: $(AZURE_MISTRAL_KEY)
              AZURE_GPT4O_ENDPOINT: $(AZURE_GPT4O_ENDPOINT)
              AZURE_GPT4O_KEY: $(AZURE_GPT4O_KEY)
              AZURE_COHERE_ENDPOINT: $(AZURE_COHERE_ENDPOINT)
              AZURE_COHERE_KEY: $(AZURE_COHERE_KEY)
              AZURE_KIMI_ENDPOINT: $(AZURE_KIMI_ENDPOINT)
              AZURE_KIMI_KEY: $(AZURE_KIMI_KEY)
              AZURE_O3MINI_ENDPOINT: $(AZURE_O3MINI_ENDPOINT)
              AZURE_O3MINI_KEY: $(AZURE_O3MINI_KEY)
              AZURE_GPT41_ENDPOINT: $(AZURE_GPT41_ENDPOINT)
              AZURE_GPT41_KEY: $(AZURE_GPT41_KEY)
              AZURE_PHI4_ENDPOINT: $(AZURE_PHI4_ENDPOINT)
              AZURE_PHI4_KEY: $(AZURE_PHI4_KEY)
              AZURE_GROK_ENDPOINT: $(AZURE_GROK_ENDPOINT)
              AZURE_GROK_KEY: $(AZURE_GROK_KEY)
