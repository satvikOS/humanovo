# Azure Pipelines equivalent of .github/workflows/deploy.yml
# Deploys frontend to S3 + CloudFront
trigger:
  branches:
    include:
      - main
      - humanovo
      - claude/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  AWS_REGION: 'us-east-1'
  ENVIRONMENT: 'dev'

stages:
  - stage: Build
    displayName: 'Build Frontend'
    jobs:
      - job: BuildFrontend
        displayName: 'Build Frontend'
        timeoutInMinutes: 10
        steps:
          - task: NodeTool@0
            displayName: 'Set up Node.js 20'
            inputs:
              versionSpec: '20.x'

          - script: |
              npm ci
              npm run build
            displayName: 'Install & Build'
            workingDirectory: frontend

          - publish: frontend/dist
            artifact: frontend-dist
            displayName: 'Publish frontend artifact'

  - stage: Deploy
    displayName: 'Deploy to AWS'
    dependsOn: Build
    jobs:
      - job: DeployFrontend
        displayName: 'Deploy Frontend'
        timeoutInMinutes: 10
        steps:
          - download: current
            artifact: frontend-dist
            displayName: 'Download frontend artifact'

          - task: AWSShellScript@1
            displayName: 'Find S3 Bucket'
            name: findBucket
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'genup-$(ENVIRONMENT)-')].Name | [0]" --output text)
                if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
                  echo "ERROR: Bucket not found"
                  exit 1
                fi
                echo "##vso[task.setvariable variable=S3_BUCKET;isOutput=true]$BUCKET"
                echo "Found bucket: $BUCKET"

          - task: AWSShellScript@1
            displayName: 'Deploy to S3'
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                BUCKET="$(findBucket.S3_BUCKET)"
                DIST_DIR="$(Pipeline.Workspace)/frontend-dist"

                # 1. Upload index.html with no-cache
                aws s3 cp "$DIST_DIR/index.html" "s3://$BUCKET/index.html" \
                  --sse AES256 \
                  --cache-control "no-cache, no-store, must-revalidate" \
                  --content-type "text/html"

                # 2. Upload hashed assets with immutable cache
                if [ -d "$DIST_DIR/assets" ]; then
                  aws s3 sync "$DIST_DIR/assets/" "s3://$BUCKET/assets/" \
                    --sse AES256 \
                    --cache-control "public, max-age=31536000, immutable"
                fi

                # 3. Sync remaining files
                aws s3 sync "$DIST_DIR/" "s3://$BUCKET/" \
                  --sse AES256 \
                  --cache-control "no-cache" \
                  --exclude "index.html" \
                  --exclude "assets/*"

                echo "Deployed to s3://$BUCKET/"

          - task: AWSShellScript@1
            displayName: 'Invalidate CloudFront'
            inputs:
              awsCredentials: 'aws-humanovo'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                DIST_ID=$(aws cloudfront list-distributions \
                  --query "DistributionList.Items[?Origins.Items[?contains(DomainName, 'genup-$(ENVIRONMENT)')]].Id | [0]" \
                  --output text)

                if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
                  echo "No CloudFront distribution found"
                  exit 0
                fi

                INVALIDATION_ID=$(aws cloudfront create-invalidation \
                  --distribution-id "$DIST_ID" \
                  --paths "/*" \
                  --query "Invalidation.Id" --output text)

                echo "Waiting for invalidation $INVALIDATION_ID..."
                aws cloudfront wait invalidation-completed \
                  --distribution-id "$DIST_ID" \
                  --id "$INVALIDATION_ID"

                DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query "Distribution.DomainName" --output text)
                echo "Live at: https://$DOMAIN"
